            ${m.unmatched.length?`<div style="font-size:11px;color:#8089a8;max-height:60px;overflow:auto">Unmatched: ${m.unmatched.slice(0,20).map(xe).join(', ')}${m.unmatched.length>20?'…':''}</div>`:''}
          </div>`;}).join(''):(ct.parseError?`<div style="color:#a52d6d">${xe(ct.parseError)}</div>`:'<div style="color:#8089a8">No Courts/Jail rows found in this file.</div>')}
        </div>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn-g" style="font-size:11px" onclick="M.prevNotes=null;H.om('data');">Cancel</button><button class="btn-n" style="font-size:11px" onclick="H.commitNotes()">Confirm Import (${lkMonths.length + ctMonths.length} month-records)</button></div>
      </div>`;
      })()):''}
    </div>
    <div style="background:#eef6ee;border:1px solid #bfe0bf;border-radius:8px;padding:14px 16px;margin-bottom:10px">
      <div style="font-weight:700;font-size:13px;color:#1a2861;margin-bottom:6px">🎯 Klip Billing Export <span style="font-size:10px;color:#8089a8;font-weight:400;text-transform:uppercase;letter-spacing:.04em">Weekly · moved from Director Hub</span></div>
      <div style="font-size:12px;color:#3e4a78;margin-bottom:8px">Drop the Pimsy Klipfolio billing export (.xlsx) — a genuinely separate file from the Pimsy Notes export above (different columns entirely), not a cut of it. Reads Client/Service Date/Service Code/Provider/Total Charge/Total Paid, bucketed by month, and saves straight into the shared Klip/Pimsy history Director Hub reads on every load — <strong>you can keep uploading here from now on; Director Hub's own "↑ Upload Pimsy / Notes Export" button still works too</strong> as a fallback during the transition, so nothing breaks if this one gets skipped by mistake.</div>
      <input type="file" accept=".xlsx,.xls" onchange="H.slotFileKlip(this)" style="font-size:12px;font-family:inherit">
      ${M.prevKlip?(M.prevKlip.error?`<div style="background:#FEE2E2;border:1px solid #FCA5A5;border-radius:8px;padding:12px 14px;margin-top:8px"><div style="font-size:12px;color:#7F1D1D;font-weight:700">Couldn't read that file</div><div style="font-size:12px;color:#7F1D1D">${xe(M.prevKlip.error)}</div><div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn-g" style="font-size:11px" onclick="M.prevKlip=null;H.om('data');">OK</button></div></div>`:(()=>{

          return `<div style="border-bottom:1px solid #f0ece3;padding:6px 0">
          <div style="font-weight:700;color:#1a2861;margin-bottom:4px">${xe(m.period)}${m.partial?' <span style="color:#a07e0a;font-weight:600">(partial)</span>':''} <span style="font-weight:400;color:#8089a8">— through ${xe(m.periodEndDate)}</span></div>
          ${mgrRows}
        </div>`;
        }).join('');
        return `<div style="background:#fff;border:1px solid #cdc4b2;border-radius:8px;padding:12px 14px;margin-top:8px">
        <div style="font-size:12px;color:#1a2861;font-weight:700;margin-bottom:6px">Preview — Klip Billing (${months.length} month${months.length!==1?'s':''} found)</div>

        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn-g" style="font-size:11px" onclick="M.prevKlip=null;H.om('data');">Cancel</button><button class="btn-n" style="font-size:11px" onclick="H.commitKlip()">Confirm Import</button></div>

      <div style="font-size:12px;color:#3e4a78;margin-bottom:8px">Drop QuickBooks' "Profit and Loss by Class" export (.xlsx) — one month per file, or a multi-month export with per-month columns. Reads the same 7 division columns (Community, Hospitals, Linkage, Clinical, Justice Involved, Call Centers, Other) and Administrative overhead Director Hub has always read from this file. Saves straight to the shared financial history Director Hub reads on every load — <strong>you can keep uploading here from now on; Director Hub's own "↑ Refresh P&L Data" button still works too</strong> as a fallback during the transition, so nothing breaks if this one gets skipped by mistake.</div>

// ══════════════════════════════════════════════════════════
// XLSX (ZIP+XML) READER — real binary Excel files, no external libraries.
// Scans sheets in document order and auto-picks the first one whose header
// row has both an ID column and the column needed for the given field
// (hours/caseload/lateNotes), so master workbooks with many historical
// sheets (e.g. one tab per bi-weekly period) resolve to the current period
// automatically without the user needing to pick a tab.
// ══════════════════════════════════════════════════════════
async function readXlsxSheetRows(buf, sheetIndexOrEl, entries, readE, px, strings){
  const xml=await readE(sheetIndexOrEl);
  const rows=[];
  px(xml).querySelectorAll('row').forEach(rowEl=>{
    const row=[];rowEl.querySelectorAll('c').forEach(c=>{
      const ref=c.getAttribute('r')||'',cs=ref.replace(/[0-9]/g,'');
      let col=0;for(const ch of cs)col=col*26+ch.charCodeAt(0)-64;col--;
      const t=c.getAttribute('t');
      let val='';
      if(t==='inlineStr'){
        const isEl=c.querySelector('is');
        val=isEl?Array.from(isEl.querySelectorAll('t')).map(tt=>tt.textContent).join(''):'';
      } else {
        const vEl=c.querySelector('v');
        val=vEl?vEl.textContent:'';
        if(t==='s')val=strings[parseInt(val)]||'';
        else if(val!=='')val=isNaN(+val)?val:+val;
      }
      row[col]=val;
    });
    for(let j=0;j<row.length;j++)if(row[j]===undefined)row[j]='';
    if(row.some(v=>v!==''))rows.push(row);
  });
  return rows;
}
async function parseXlsxSmart(buf, field){

  if(eocd<0)throw new Error('Not a valid Excel file (missing ZIP signature).');
  const cdCount=u16(eocd+10),cdOffset=u32(eocd+16);
  const entries={};let pos=cdOffset;
  for(let e=0;e<cdCount;e++){
    if(u32(pos)!==0x02014B50)break;
    const method=u16(pos+10),csize=u32(pos+20),fnLen=u16(pos+28),exLen=u16(pos+30),cmLen=u16(pos+32),lhOff=u32(pos+42);
    const name=dec.decode(b.slice(pos+46,pos+46+fnLen));
    entries[name]={method,csize,lhOff};pos+=46+fnLen+exLen+cmLen;
  }
  async function readE(name){
    const e=entries[name]||entries[Object.keys(entries).find(k=>k.endsWith('/'+name)||k===name)];
    if(!e)throw new Error('Not found in workbook: '+name);
    const lhFnLen=u16(e.lhOff+26),lhExLen=u16(e.lhOff+28),ds=e.lhOff+30+lhFnLen+lhExLen;
    const raw=b.slice(ds,ds+e.csize);
    if(e.method===0)return dec.decode(raw);
    const st=new DecompressionStream('deflate-raw');
    const w=st.writable.getWriter();w.write(raw);w.close();
    const ch=[];const r=st.readable.getReader();
    while(true){const{done,value}=await r.read();if(done)break;ch.push(value);}

function parsePeriodFromSheetName(name){
  if(!name) return null;
  const s=String(name).trim();
  const m=s.match(/(\d{1,2})[.\/-](\d{1,2})\s*(?:-|to|_)\s*(\d{1,2})[.\/-](\d{1,2})/i);
  if(!m) return null;
  const m1=parseInt(m[1]),d1=parseInt(m[2]),m2=parseInt(m[3]),d2=parseInt(m[4]);
  if(m1<1||m1>12||m2<1||m2>12||d1<1||d1>31||d2<1||d2>31) return null;
  const now=new Date();
  let year=now.getFullYear();
  let end=new Date(year,m2-1,d2);
  const diffDays=(end-now)/86400000;
  if(diffDays>90) year-=1;
  else if(diffDays<-450) year+=1;
  end=new Date(year,m2-1,d2);
  let start=new Date(year,m1-1,d1);
  if(end<start){ start=new Date(year-1,m1-1,d1); }
  const pad=n=>String(n).padStart(2,'0');
  const key=`${end.getFullYear()}-${pad(end.getMonth()+1)}-${pad(end.getDate())}`;
  const label=`${pad(m1)}.${pad(d1)} - ${pad(m2)}.${pad(d2)}`;
  return {key,label,start,end};
}

// Used both when guessing which tab is the current period AND when picking
// which earlier tab to compare against, so stray/partial tabs (e.g. a
// half-populated export sitting between two real biweekly tabs) never get
// silently used as the "previous period" just because they're next in
// date-sorted order.
function periodCandidateIsPopulated(c){

  if(!matched.length) return false;
  const nonzero=matched.filter(m=>typeof m.val==='number'&&m.val>0.5).length;
  const total=matched.length+unmatched.length;

  // still a partial/stray export, not the real period.
  return nonzero>=5 && (nonzero/matched.length)>=0.2 && coverage>=0.85;

// so commitPD()/S.pd storage doesn't need to change at all. Replaces the separate Employee ID /
// Clients / Billable Encounters rollup upload with the same monthly Notes export already used
// for Clinical Goals and Linkage — there's no separate Courts/Jail data source, it's all in
// this one file, split out by Division (Cuyahoga County Jail, OneOhio, COSSAP/ Oriana, and any
// future "Courts"-named program — matched loosely by regex so a new program name doesn't
// silently fall through).
//   - Clients: distinct Client # touched by that staff member within the target month.
//   - Billable Encounters: notes with a real billing code — anything except "(ADMIN)
//     Administrative Notes" and "(Non-billable ) note that are not able to be billed".
//   - Staff matched by name against the same S.staff roster used everywhere else in this hub
//     (fn+' '+ln, case-insensitive) — not by a numeric Employee ID, since the raw export has
//     no ID column at all, only "Performed By" name text.

  }

    let prev=dp[0]; dp[0]=i;
    for(let j=1;j<=n;j++){
      const tmp=dp[j];

// OPTUM SLA & DISENROLLMENT EXPORT — moved here from Linkage Hub (linkage-hub.html) on 9/24/26,
// per Brandon's centralization direction. This is a close port of Linkage Hub's own
// importOptumSlaExport() and its small helpers (optumSlaHeaderIndex/optumSlaCol/optumSlaTruthy/
// optumSlaParseDate/optumSlaMonthKey) — same column-matching logic, same month aggregation. Two
// real differences from the original: (1) it reuses THIS hub's own parseXlsxNamedSheets rather
// than a duplicate reader, which already converts date-styled cells straight to JS Date objects

// optumSlaParseDate here has an added `raw instanceof Date` branch to match; and (2) there's no
// on-page Optum SLA view to re-render afterward, so this just writes to Supabase and shows a
// toast — Linkage Hub picks the new numbers up on its own next load, exactly like the Klip/P&L
// moves above.
// ══════════════════════════════════════════════════════════
function optumSlaHeaderIndex(headerRow){
  const idx={};
  headerRow.forEach((h,i)=>{
    const norm = String(h||'').trim().toLowerCase().replace(/\s+/g,' ');
    if(norm) idx[norm]=i;
  });
  return idx;
}
function optumSlaCol(idx, name){ return idx[name.trim().toLowerCase().replace(/\s+/g,' ')]; }
function optumSlaTruthy(v){ return /^(y|yes|true|1)$/i.test(String(v==null?'':v).trim()); }
function optumSlaParseDate(raw){
  if(raw==null || raw==='') return null;
  if(raw instanceof Date) return isNaN(raw) ? null : raw.toISOString().slice(0,10); // this hub's parseXlsxNamedSheets returns real Date objects for date-styled cells
  if(typeof raw==='string' && /^\d{4}-\d{2}-\d{2}/.test(raw)) return raw.slice(0,10);
  if(typeof raw==='number' && raw>20000 && raw<80000){
    const epoch=new Date(Date.UTC(1899,11,30));
    return new Date(epoch.getTime()+Math.floor(raw)*86400000).toISOString().slice(0,10);
  }

    if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  }

}

  if(!dateStr) return null;
  const m = String(dateStr).match(/^(\d{4})-(\d{2})/);
  return m ? `${m[1]}-${m[2]}` : null;
}
function parseOptumSlaWorkbook(sheets, fileName){
  const sheetName = Object.keys(sheets)[0];
  const rows = sheetName ? sheets[sheetName] : null;
  if(!rows || rows.length < 1) throw new Error('No sheets found in this file.');
  const idx = optumSlaHeaderIndex(rows[0]);
  const cAdt = optumSlaCol(idx,'ADT Notification Received Date');
  const cFollowup = optumSlaCol(idx,'Follow-Up Within 24 Business Hours (Y/N)');
  const cDisenrollTrigger = optumSlaCol(idx,'Disenrollment Trigger');
  const cDisenrollDate = optumSlaCol(idx,'Disenrollment Date');
  if(cAdt==null || cFollowup==null || cDisenrollDate==null){
    throw new Error('Expected columns not found (ADT Notification Received Date / Follow-Up Within 24 Business Hours / Disenrollment Date) — is this the referral tracker template?');
  }
  const cFirst = optumSlaCol(idx,'Member Name First'), cLast = optumSlaCol(idx,'Member Name Last');

  const byMonth = {};
  const ensure = (mo) => byMonth[mo] || (byMonth[mo] = { followupTotal:0, followupYes:0, disenrolled:[] });
  dataRows.forEach(r=>{
    const adtDate = optumSlaParseDate(r[cAdt]);
    const adtMonth = optumSlaMonthKey(adtDate);
    if(adtMonth && r[cFollowup]!==''&&r[cFollowup]!=null){
      const b = ensure(adtMonth);

    const disDate = optumSlaParseDate(r[cDisenrollDate]);

    }
  });

function parseBdReferralCsv(text){

function normalizeMonthLabel(text){

function monthColLabel(raw){
  if(raw instanceof Date && !isNaN(raw)){
    return raw.toLocaleDateString('en-US',{month:'short',year:'numeric',timeZone:'UTC'});
  }
  const s=String(raw||'').trim();
  if(/^[A-Za-z]{3,9}[\s-]\d{2,4}$/.test(s)) return normalizeMonthLabel(s);
  return null;
}
const SUP_NAME_ALIASES={
  'janine roulete':'janine roulette',
  'raegan dalton':'raegen dalton',
  'kayla wludya':'kayla wludyga',
  'hunter von carlowitz':'hunter-dane von carlowitz',
};
function foldSupAliases(data){
  const merged={...data};
  Object.entries(SUP_NAME_ALIASES).forEach(([wrong,correct])=>{
    if(merged[wrong]){
      merged[correct]=merged[correct]||{};
      Object.entries(merged[wrong]).forEach(([cred,months])=>{
        const existing=merged[correct][cred]||[];
        merged[correct][cred]=Array.from(new Set([...existing,...(months||[])]));
      });
      delete merged[wrong];
    }
  });
  return merged;
}
function foldLegacyCredentials(data){
  const merged={...data};
  Object.values(merged).forEach(rec=>{
    ['QBHS','CDCA'].forEach(plain=>{
      if(rec[plain]){
        const target=`${plain} - Supervision`;
        rec[target]=rec[target]||[];
        rec[target]=Array.from(new Set([...rec[target],...(rec[plain]||[])]));
        delete rec[plain];
      }
    });
  });
  return merged;
}

function supRowsFromSheets(sheets){
  const staffByName={};S.staff.forEach(s=>{staffByName[(s.fn+' '+s.ln).trim().toLowerCase().replace(/\s+/g,' ')]=s;});
  const matched=[],unmatched=[];const seenUnmatched=new Set();

  function addRow(fullName,cred,month,completed){
    // Live Supabase alias table is the primary lookup now — new name variants
    // are a one-row insert there instead of a code change. SUP_NAME_ALIASES
    // stays as a fallback only for the rare case the network call hasn't
    // landed yet when this runs.
    let staff=resolveStaffByAlias(fullName);
    if(!staff){
      let key=fullName.toLowerCase().replace(/\s+/g,' ').trim();
      key=SUP_NAME_ALIASES[key]||key;
      staff=staffByName[key];
    }
    if(!staff){ const key=fullName.toLowerCase().replace(/\s+/g,' ').trim(); if(!seenUnmatched.has(key)){seenUnmatched.add(key);unmatched.push(fullName);} return; }
    matched.push({key:(staff.fn+' '+staff.ln).trim().toLowerCase(),name:staff.fn+' '+staff.ln,cred,month,completed});
  }

  Object.entries(sheets).forEach(([sheetName,rows])=>{
    if(!rows || !rows.length) return;
    const rawHdr=rows[0];
    const hdr=rawHdr.map(h=>String(h||'').trim());
    const credBase = /prs/i.test(sheetName)?'PRS' : /qbhs/i.test(sheetName)?'QBHS' : /swt/i.test(sheetName)?'SWT' : /cdca/i.test(sheetName)?'CDCA' : sheetName;
    const firstIdx=hdr.findIndex(h=>/^first name$/i.test(h));
    const lastIdx=hdr.findIndex(h=>/^last name$/i.test(h));
    const pairedCols=hdr.map((h,i)=>({i,h})).filter(x=>/caseload review|supervision/i.test(x.h));

    if(pairedCols.length){
      for(let r=1;r<rows.length;r++){
        const row=rows[r]; if(!row) continue;
        const fn=(firstIdx>=0?row[firstIdx]:'')||'';
        const ln=(lastIdx>=0?row[lastIdx]:'')||'';
        const full=`${fn} ${ln}`.trim(); if(!full) continue;
        pairedCols.forEach(({i,h})=>{
          const m=h.match(/^(.+?)\s+(caseload review|supervision)$/i);
          if(!m) return;
          const month=normalizeMonthLabel(m[1]);
          const type=/caseload/i.test(m[2])?'Caseload Review':'Supervision';
          const v=row[i];
          const completed = v!=null && v!=='';
          addRow(full, `${credBase} - ${type}`, month, completed);
        });
      }
    } else {
      const WEEKLY_SUP_MIN=4;
      const monthCols=rawHdr.map((h,i)=>({i,h,label:monthColLabel(h)})).filter(x=>x.label!==null);
      for(let r=1;r<rows.length;r++){
        const row=rows[r]; if(!row) continue;
        const fn=(firstIdx>=0?row[firstIdx]:'')||'';
        const ln=(lastIdx>=0?row[lastIdx]:(row[0]||''));
        const full=`${fn} ${ln}`.trim(); if(!full) continue;
        monthCols.forEach(({i,label})=>{
          const v=row[i];
          const completed = typeof v==='number' && v>=WEEKLY_SUP_MIN;
          addRow(full, `${credBase} - Supervision`, label, completed);
        });
      }
    }
  });

  return {matched,unmatched};
}

function lkFindRow(rows, matchFns){
  for(let r=0;r<rows.length;r++){
    const row=(rows[r]||[]).map(c=>String(c==null?'':c).trim());
    if(matchFns.every(fn=>row.some(t=>fn(t)))) return r;
  }
  return -1;
}
function lkCellText(v){ return String(v==null?'':v).trim(); }
function lkNum(v){ return typeof v==='number' ? v : (parseFloat(v)||0); }
function fmtLinkNum(n){ return (typeof n==='number'?n:0).toLocaleString(); }

function lkExtractKpiTile(rows, labelRe){
  const r = lkFindRow(rows,[t=>labelRe.test(t)]);
  if(r<0) return null;
  const labelRow=(rows[r]||[]).map(c=>lkCellText(c));
  const col = labelRow.findIndex(t=>labelRe.test(t));
  if(col<0) return null;
  const valRow = rows[r+1]||[];
  return valRow[col];
}
function lkExtractTable(rows, headerMatchers){
  const headerRow = lkFindRow(rows, headerMatchers);
  if(headerRow<0) return {rows:[], headerRowIdx:-1};
  const out=[];
  for(let r=headerRow+1; r<rows.length; r++){
    const row=rows[r]||[];
    const firstLabel = lkCellText(row[1]!=null?row[1]:row[0]);
    if(!firstLabel) break;
    if(/^[▶⚠📋]/.test(firstLabel)) break;
    out.push(row);
  }
  return {rows:out, headerRowIdx:headerRow};
}

// Raw Pimsy "Notes" export → same linkage_data shape parseLinkageDashboardWorkbook produces,
// so Director Hub's Linkage page and every downstream consumer of the linkage_data Supabase
// key don't have to change at all. Replaces the hand-built Linkage Dashboard workbook AND
// Linkage Hub's "paste Pimsy export with Auto columns" flow with one direct EHR export upload
// here in Data & Staff Hub — matching how Director Hub's Clinical Goals now reads straight
//   - U-code stage counts: read straight out of Billing Code text — U1–U9 all appear literally
//     in it (confirmed against a real export: U5 "Successful initial linkage to treatment",
//     U7 "Successful engagement to treatment", U8 "Unsuccessful engagement to treatment") —
//     restricted to Buckeye-billed rows (Insurance Co. contains "buckeye"), matching Model 2.0's
//     Buckeye-only U-code billing rule already enforced in Linkage Hub's own lkParse().
//   - Revenue: Duration in Minutes ÷ 60 × $69.96/hr (LINKAGE_H0038_RATE), Buckeye U-code rows only.
//   - G9009 count/category: any Billing Code containing "G9009", across all payers (matches
//     lkParse()'s own logic — it doesn't restrict G9009 to Buckeye either).
//   - Outreach attempts: "(OTR- Linkage) Linkage Outreach" billing code, all payers.
//   - Site: there's no site column in a raw Notes export, so site is inferred from a static
//     staff→site roster (LINKAGE_STAFF_SITE_MAP below), copied from Linkage Hub's own
//     DATA.sites/providers arrays. This is only as current as that roster — update it there
//     first if a provider changes sites. Genieva Sandel's 4/20/26 Sunrise Vista→Central Pool
//     transfer is date-split the same way Director Hub's Klip parser already handles it.
//   - NOT computable from this export — returned as null/empty, flagged to the person in the
//     preview so it's not mistaken for zero: Community Transition / LOS table, since that needs
//     per-client enrollment↔discharge date pairing across the whole file's history, not a
//     single-row computation. Deferred.
const LINKAGE_H0038_RATE = 69.96; // kept for reference/legacy callers — no longer used for Linkage revenue, see LINKAGE_UCODE_RATES
// Confirmed 8/26 as the real methodology for Linkage revenue: flat per-code amount, not
// duration × hourly rate. G9009 is priced too (it wasn't before) — Buckeye rows only, same

const LINKAGE_UCODE_RATES = {U1:125,U2:75,U3:175,U4:115,U5:125,U6:75,U7:250,U8:75,U9:400,G9009:75.90};

// Buckeye-row / linkage-row classification — shared by parseLinkageNotesExport (fresh upload)
// and computeLinkageMonthFromRows (recompute from a merged raw pool), so both paths agree on
// exactly the same definition of what counts.
function lkIsBKRow(row){ return /buckeye/i.test(String(row.ins||'')); }
// Division text is unreliable in Pimsy — staff sometimes leave a Buckeye U-code note under
// "MH/SUD Community Services" instead of "...Linkage" (confirmed against a real export: 13
// Buckeye-billed, real U-code notes — U1 through U9, including one client's entire U5→U7→U9
// sequence — were silently dropped from every count solely because Division didn't say
// "linkage"). A Buckeye-billed row carrying a literal U-code IS a linkage note by definition,
// independent of whatever Division got selected, so that's checked directly as a second path
// rather than trusting Division alone.
function lkIsLinkageRow(row){
  const div = String(row.div||''); const code = String(row.code||'');
  if(/linkage/i.test(div) || /OTR-\s*Linkage/i.test(code)) return true;
  if(lkIsBKRow(row) && /U(\d)\b/i.test(code)) return true;
  return false;
}
// Core month-snapshot computation — takes an array of minimal row objects
// ({date:Date, by, code, ins, client, div}), not raw sheet rows, so it can run either on a
// fresh upload's rows OR on a merged multi-upload raw pool loaded back from Supabase. This is
// what actually makes weekly delta uploads safe: the SAME computation just gets handed a bigger
// (merged) array of rows the second time, instead of a new upload's parse replacing the month.
function computeLinkageMonthFromRows(inMonth, targetY, targetM){
  const periodLabel = new Date(Date.UTC(targetY,targetM,1)).toLocaleDateString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});
  const periodKey = new Date(Date.UTC(targetY,targetM,1)).toISOString().split('T')[0];

  let maxDateInMonth = null;
  inMonth.forEach(row=>{ if(row.date && (!maxDateInMonth || row.date>maxDateInMonth)) maxDateInMonth = row.date; });
  // Partial-month detection: if the data for this month doesn't reach the month's actual last
  // calendar day, this is an in-progress month (e.g. uploaded mid-month), not a complete one.
  // Comparing it directly against a full prior month in a month-over-month delta would show a
  // false decline that's really just "10 days of data vs. 31" — Linkage Hub needs to know not
  // to do that comparison, and to label it clearly wherever it's shown.
  const daysInMonth = new Date(Date.UTC(targetY,targetM+1,0)).getUTCDate();
  const isPartial = maxDateInMonth ? maxDateInMonth.getUTCDate() < daysInMonth : false;
  const partialThrough = maxDateInMonth ? maxDateInMonth.toLocaleDateString('en-US',{month:'short',day:'numeric',timeZone:'UTC'}) : null;
  const linkageRows = inMonth.filter(lkIsLinkageRow);

  const clients = new Set(); const uCounts = {}; let revenue = 0, outreachAttempts = 0, g9009Total = 0;
  const siteMap = {}, payerMap = {}, g9009Cats = {}, providerMap = {};
  // Per-client tracking for Buckeye Pipeline's "Avg notes/client" and "Avg days → U5" tiles —
  // both were previously frozen at whatever was hand-typed in originally; both are directly
  // computable from the raw export, just needed per-client bookkeeping instead of a running total.
  const bkClientNoteCount = {}, bkClientFirstContact = {}, bkClientFirstU5 = {};
  // Non-Buckeye ("All Other Medicaid") tracking — that whole page was never wired to any real
  // data source before this. Conversion rate specifically is NOT included here: Pimsy has no
  // "Conversion" note type in this export to compute it from cleanly, so it's left out rather
  // than faked — see nonBk.conversion_rate note below.
  const nonBkClients = new Set(), nonBkCaresourceClients = new Set();
  let nonBkOutreach = 0, nonBkUCodeFlagged = 0;

  linkageRows.forEach(row=>{
    const code = String(row.code||'');
    const ins = String(row.ins||'').trim() || 'Unknown';
    const d = row.date;
    const name = String(row.by||'').trim();
    const clientId = row.client;
    if(clientId!=null && clientId!=='') clients.add(clientId);

    if(clientId!=null && clientId!==''){
      if(lkIsBKRow(row)){
        bkClientNoteCount[clientId] = (bkClientNoteCount[clientId]||0)+1;
        if(d && (!bkClientFirstContact[clientId] || d<bkClientFirstContact[clientId])) bkClientFirstContact[clientId]=d;
      }else{
        nonBkClients.add(clientId);
        if(/caresource/i.test(ins)) nonBkCaresourceClients.add(clientId);
      }
    }
    if(!lkIsBKRow(row) && /OTR-\s*Linkage/i.test(code)) nonBkOutreach++;
    if(!lkIsBKRow(row) && code.toUpperCase().match(/U(\d)\b/)) nonBkUCodeFlagged++; // per Model 2.0, non-Buckeye should have zero U-code billing at all

    if(/g9009/i.test(code)){
      g9009Total++;
      if(lkIsBKRow(row)) revenue += LINKAGE_UCODE_RATES.G9009; // priced now — wasn't before
      // Category comes from whatever's left after stripping the "(G9009)"/"G9009"/"SSR
      // Completed" boilerplate — prefer a trailing parenthetical ("(MH Resource)") when
      // present, since that's the more specific label on the "--Other" style codes.
      let s = code.replace(/^\(\s*G9009\s*\)\s*/i,'').replace(/G9009/gi,'');
      const paren = s.match(/\(([^)]+)\)/);
      let cat = paren ? paren[1].trim() : s.replace(/SSR\s*(Completed)?/gi,'').replace(/^[\s-]+/,'').trim();
      if(!cat) cat = 'Other';
      g9009Cats[cat] = (g9009Cats[cat]||0)+1;
    }
    if(/OTR-\s*Linkage/i.test(code)) outreachAttempts++;

    const um = code.toUpperCase().match(/U(\d)\b/);
    if(um && lkIsBKRow(row)){
      const uk = 'U'+um[1];
      uCounts[uk] = (uCounts[uk]||0)+1;
      if(uk==='U5' && clientId!=null && clientId!=='' && d && (!bkClientFirstU5[clientId] || d<bkClientFirstU5[clientId])) bkClientFirstU5[clientId]=d;
      const rowRev = LINKAGE_UCODE_RATES[uk] || 0;
      revenue += rowRev;
      const site = linkageSiteForRow(name, d);
      siteMap[site] = siteMap[site] || {approached:0, initiated:0, u7:0, u9:0, revenue:0, count:0};
      siteMap[site].count++; siteMap[site].revenue += rowRev;
      if(['U1','U2','U3','U4'].includes(uk)) siteMap[site].approached++;
      if(uk==='U1'||uk==='U3') siteMap[site].initiated++;
      if(uk==='U7') siteMap[site].u7++;
      if(uk==='U9') siteMap[site].u9++;

      payerMap[ins] = payerMap[ins] || {approached:0, initiated:0, u7:0, u9:0, revenue:0};
      payerMap[ins].revenue += rowRev;
      if(['U1','U2','U3','U4'].includes(uk)) payerMap[ins].approached++;
      if(uk==='U1'||uk==='U3') payerMap[ins].initiated++;
      if(uk==='U7') payerMap[ins].u7++;
      if(uk==='U9') payerMap[ins].u9++;

      // Per-provider numbers — feeds Linkage Hub's Provider Scorecard (bk_mo/u1_total..u9_total/
      // invoiced_mo) so that table refreshes from real data each upload instead of staying
      // frozen at whatever was hand-typed in originally. Site/status stay a manual layer in
      // Linkage Hub itself — only the numbers come from here. Site IS attached below (reusing
      // the same lookup already computed for the site-level breakdown) so a genuinely NEW
      // provider gets their real site on first appearance instead of a hardcoded "Unknown" —
      // that gap was real: David Lundgren, Debra West, and anyone else added after the original
      // 8-person seed list all showed Unknown regardless of having a real site in
      // LINKAGE_STAFF_SITE_MAP, since site was never threaded through to here.
      // Every U-code (U1–U9) is tracked per provider now, not just U7/U9 — the Provider
      // Scorecard shows the full pipeline per person, same nine codes counted everywhere else.
      if(name){
        providerMap[name] = providerMap[name] || {approached:0, u1:0,u2:0,u3:0,u4:0,u5:0,u6:0,u7:0,u8:0,u9:0, revenue:0, site};
        if(['U1','U2','U3','U4'].includes(uk)) providerMap[name].approached++;
        providerMap[name][uk.toLowerCase()]++;
        providerMap[name].revenue += rowRev;
      }
    }
  });

  // U1–U9 all appear literally in Billing Code text in this export (U5 "Successful initial
  // linkage to treatment", U7 "Successful engagement to treatment", U8 "Unsuccessful
  // engagement to treatment") — confirmed against a real file, not assumed. Earlier versions
  // of this parser incorrectly hardcoded u5/u7 as null; they're real counts, same as U1–U4/U6/U9.
  const u1=uCounts['U1']||0, u2=uCounts['U2']||0, u3=uCounts['U3']||0, u4=uCounts['U4']||0,
        u5=uCounts['U5']||0, u6=uCounts['U6']||0, u7=uCounts['U7']||0, u8=uCounts['U8']||0, u9=uCounts['U9']||0;
  const initiated = u1+u3, approached = u1+u2+u3+u4;

  // Avg notes/client — total Buckeye linkage notes ÷ unique Buckeye clients touched.
  const bkClientIds = Object.keys(bkClientNoteCount);
  const avgNotesPerClient = bkClientIds.length ? bkClientIds.reduce((s,id)=>s+bkClientNoteCount[id],0)/bkClientIds.length : null;
  // Avg days → U5 — for each client who actually reached U5, days between their first Buckeye
  // linkage contact and their first U5. Only meaningful for clients with both dates; a client
  // approached but never reaching U5 doesn't have a "days to U5" at all.
  const daysToU5List = Object.keys(bkClientFirstU5).map(id=>{
    const first = bkClientFirstContact[id], u5date = bkClientFirstU5[id];
    if(!first || !u5date) return null;
    return Math.round((u5date-first)/86400000);
  }).filter(v=>v!=null && v>=0);
  const avgDaysToU5 = daysToU5List.length ? daysToU5List.reduce((s,v)=>s+v,0)/daysToU5List.length : null;

  const kpi = {
    clientsServed: clients.size, initiated, u1, u3, u5, u7, u9,
    totalApproachAttempts: approached,
    revenue: Math.round(revenue*100)/100,
    g9009Ratio: initiated>0 ? Math.round((g9009Total/initiated)*1000)/1000 : null,
    linkageRateApproached: approached>0 ? Math.round((u9/approached)*1000)/1000 : null,
    linkageRateInitiated: initiated>0 ? Math.round((u9/initiated)*1000)/1000 : null,
    avgNotesPerClient: avgNotesPerClient!=null ? Math.round(avgNotesPerClient*10)/10 : null,
    avgDaysToU5: avgDaysToU5!=null ? Math.round(avgDaysToU5) : null,
  };
  // All Other Medicaid (non-Buckeye) — this whole page previously had no live data source at
  // all. conversion_rate is deliberately left out: Pimsy has no distinct "Conversion" note type
  // in this export to compute it from, so rather than fabricate a number, it's just not here —
  // flagged in _unavailable below instead of silently showing a fake rate.
  const nonBk = {
    unique_touched: nonBkClients.size,
    caresource_touched: nonBkCaresourceClients.size,
    outreach_contacts: nonBkOutreach,
    billing_notes_flagged: nonBkUCodeFlagged,
    conversion_rate: null,
  };
  const pipeline = [
    {stage:'Approached', code:'U1+U2+U3+U4', count:approached, rate:null, target:null, status:null},
    {stage:'Initiated',  code:'U1+U3', count:initiated, rate: approached?Math.round((initiated/approached)*1000)/1000:null, target:null, status:null},
    {stage:'Linked', code:'U5', count:u5, rate: initiated?Math.round((u5/initiated)*1000)/1000:null, target:null, status:null},
    {stage:'Unsuccessful initial linkage', code:'U6', count:u6, rate:null, target:null, status:null},
    {stage:'Engaged', code:'U7', count:u7, rate: u5?Math.round((u7/u5)*1000)/1000:null, target:null, status:null},
    {stage:'Unsuccessful engagement', code:'U8', count:u8, rate:null, target:null, status:null},
    {stage:'Maintained engagement', code:'U9', count:u9, rate: u7?Math.round((u9/u7)*1000)/1000:null, target:null, status:null},
  ];
  const sites = Object.entries(siteMap).map(([name,s])=>({
    name, approached:s.approached, initiated:s.initiated,
    init_rate: s.approached?Math.round((s.initiated/s.approached)*1000)/1000:null,
    u7:s.u7, u9:s.u9, revenue:Math.round(s.revenue*100)/100,
  }));
  const providers = Object.entries(providerMap).map(([name,p])=>({
    name, site:p.site, bk_mo:p.approached,
    u1_total:p.u1, u2_total:p.u2, u3_total:p.u3, u4_total:p.u4, u5_total:p.u5,
    u6_total:p.u6, u7_total:p.u7, u8_total:p.u8, u9_total:p.u9,
    invoiced_mo:Math.round(p.revenue*100)/100,
  }));
  const payers = Object.entries(payerMap).filter(([,p])=>p.approached||p.initiated||p.revenue).map(([name,p])=>({
    name, approached:p.approached, initiated:p.initiated,
    init_rate: p.approached?Math.round((p.initiated/p.approached)*1000)/1000:null,
    u7:p.u7, u9:p.u9, revenue:Math.round(p.revenue*100)/100,
  }));
  const g9009 = Object.entries(g9009Cats).map(([cat,count])=>({
    cat, count, pct: g9009Total?Math.round((count/g9009Total)*1000)/10:null, revenue:null,
  }));
  const weekly = [];
  {
    const byWeek = {};
    linkageRows.forEach(row=>{
      const d = row.date; if(!d) return;
      const code = String(row.code||'');
      const wk = Math.min(4, Math.floor((d.getUTCDate()-1)/7));
      byWeek[wk] = byWeek[wk] || {billingNotes:0, revenue:0, u1:0, u3:0, initiated:0, u5:0, u7:0, u9:0, g9009Count:0};
      byWeek[wk].billingNotes++;
      if(/g9009/i.test(code)){
        byWeek[wk].g9009Count++;
        if(lkIsBKRow(row)) byWeek[wk].revenue += LINKAGE_UCODE_RATES.G9009;
      }
      const um = code.toUpperCase().match(/U(\d)\b/);
      if(um && lkIsBKRow(row)){
        const uk='U'+um[1];
        if(uk==='U1') byWeek[wk].u1++;
        if(uk==='U3') byWeek[wk].u3++;
        if(uk==='U1'||uk==='U3') byWeek[wk].initiated++;
        if(uk==='U5') byWeek[wk].u5++;
        if(uk==='U7') byWeek[wk].u7++;
        if(uk==='U9') byWeek[wk].u9++;
        byWeek[wk].revenue += LINKAGE_UCODE_RATES[uk] || 0;

// Reads a raw Pimsy Notes export into the same linkage_data shape parseLinkageDashboardWorkbook
// produces, so Director Hub's Linkage page and every downstream consumer of the linkage_data
// Supabase key don't have to change at all. Also returns rawRowsByMonth — a periodKey-keyed pool
// of this upload's rows, minimal-fielded and keyed by Note # — which commitNotes() merges into
// whatever's already stored for that month (see mergeLinkageMonthRaw below) before recomputing,
// so a weekly delta upload ADDS to a month instead of replacing it wholesale.
//   - U-code stage counts: read straight out of Billing Code text — U1–U9 all appear literally
//     in it (confirmed against a real export: U5 "Successful initial linkage to treatment",
//     U7 "Successful engagement to treatment", U8 "Unsuccessful engagement to treatment") —
//     restricted to Buckeye-billed rows (Insurance Co. contains "buckeye"), matching Model 2.0's
//     Buckeye-only U-code billing rule already enforced in Linkage Hub's own lkParse().
//   - Revenue: flat per-U-code amount (LINKAGE_UCODE_RATES), Buckeye rows only. G9009 priced too.
//   - G9009 count/category: any Billing Code containing "G9009", across all payers (matches
//     lkParse()'s own logic — it doesn't restrict G9009 to Buckeye either).
//   - Outreach attempts: "(OTR- Linkage) Linkage Outreach" billing code, all payers.
//   - Site: there's no site column in a raw Notes export, so site is inferred from a static
//     staff→site roster (LINKAGE_STAFF_SITE_MAP below), copied from Linkage Hub's own
//     DATA.sites/providers arrays. This is only as current as that roster — update it there
//     first if a provider changes sites. Genieva Sandel's 4/20/26 Sunrise Vista→Central Pool
//     transfer is date-split the same way Director Hub's Klip parser already handles it.
//   - NOT computable from this export — returned as null/empty, flagged to the person in the
//     preview so it's not mistaken for zero: Community Transition / LOS table, since that needs
//     per-client enrollment↔discharge date pairing across the whole file's history, not a
//     single-row computation. Deferred.
function parseLinkageNotesExport(rows){

  const idx = name => hdr.findIndex(h=>h.toLowerCase()===name.toLowerCase());

        colIns=idx('Insurance Co.'), colClient=idx('Client #'), colDiv=idx('Division'),
        colNote=idx('Note #');
  if(colDate<0||colBy<0||colCode<0||colIns<0){
    throw new Error('Not a recognized Notes export — need Service Date, Performed By, Billing Code, and Insurance Co. columns.');
  }

    if(v==null||v==='') return null;
    if(v instanceof Date) return isNaN(v)?null:v;
    // Same convention as parseClinicalNotesExport: only the calendar date matters here (month
    // bucketing, week-of-month bucketing), so a "YYYY-MM-DD..." string is anchored to UTC
    // midnight regardless of any time-of-day portion.
    if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v.slice(0,10)+'T00:00:00Z');
    const n=+v;
    if(!isNaN(n) && typeof v!=='string') return new Date(Date.UTC(1899,11,30) + Math.floor(n)*86400000); // floor, not round - avoids rolling a PM timestamp into the next day

  }

  // computeLinkageMonthFromRows() consumes, and the same shape (serialized) that gets persisted
  // per month in S.linkageNotesRaw for future uploads to merge into.
  const allRows = [];
  for(let i=1;i<rows.length;i++){
    const row = rows[i]; if(!row) continue;
    const d = toDate(row[colDate]);

      by: String(row[colBy]||'').trim(),
      code: String(row[colCode]||''),
      ins: String(row[colIns]||'').trim(),
      client: colClient>=0 ? row[colClient] : null,
      div: colDiv>=0 ? String(row[colDiv]||'') : '',
      note: colNote>=0 ? String(row[colNote]||'') : '',

  }

  // Apr–Jun, another covered Jul–Aug) — a SINGLE most-recent-month restriction was silently
  // dropping every earlier month in the same file. Now computes one full snapshot per distinct
  // calendar month actually present, so nothing in the file gets discarded.
  const monthKeys = new Set();

    const [y,m] = key.split('-').map(Number);
    const inMonth = allRows.filter(r=>r.date.getUTCFullYear()===y && r.date.getUTCMonth()===m);
    const snap = computeLinkageMonthFromRows(inMonth, y, m);
    // Skip a month with zero actual linkage-division rows — e.g. a stray row far outside the
    // real reporting window shouldn't create a fake empty month.
    if(snap._rowCount > 0){
      delete snap._rowCount;
      months[snap.periodKey] = snap;
      // Keyed raw pool for this month — periodKey -> {noteKey: minimalSerializableRow} — for
      // commitNotes() to merge into S.linkageNotesRaw. Falls back to a synthetic key when
      // Note # is missing (rare, but seen in a handful of rows) so the row still gets stored
      // rather than silently dropped from the persisted pool.
      const pool = {};
      inMonth.forEach((r,i)=>{
        const key = r.note || `${r.date.toISOString()}|${r.by}|${r.code}|${r.client}|${i}`;
        pool[key] = {d:r.date.toISOString(), b:r.by, c:r.code, i:r.ins, cl:r.client, v:r.div};
      });

  const latest = orderedKeys.length ? months[orderedKeys[orderedKeys.length-1]] : null;

  // snapshot (unchanged shape from before this fix) — `months` carries the full multi-month
  // breakdown for callers that want everything the file actually contained, and
  // `rawRowsByMonth` is the merge input for commitNotes().
  return latest ? {...latest, months, rawRowsByMonth} : {months:{}, rawRowsByMonth:{}, period:'', periodKey:'', kpi:{clientsServed:0}, sites:[], payers:[], providers:[], g9009:[], outreach:{totalAttempts:0}, weekly:[], _unavailable:['Community Transition / LOS table']};
}
// Merges one month's newly-uploaded raw pool into whatever's already stored for that month (by
// Note # — unique per note, so an overlapping row from two exports collapses to one, and a
// genuinely new row just gets added), then recomputes that month's full snapshot from the
// COMBINED pool. This is the actual fix for "weekly delta upload wipes out earlier weeks":
// nothing about a month is ever thrown away just because the latest file didn't happen to
// re-include it — the merge is additive and de-duplicated by Note #, not a wholesale replace.

  const snap = computeLinkageMonthFromRows(rowObjs, y, (m-1)); // periodKey month is 1-indexed, computeLinkageMonthFromRows wants 0-indexed

// Notes pipeline can't reconstruct this on its own since Pimsy Notes exports don't reach back
// that far. Reuses parseLinkageDashboardWorkbook's own tab-reading logic rather than
// duplicating it — just regroups its weekly[] output into one snapshot per calendar month.

    // "month" of real-looking zeros if that upstream filter ever changes.

    const periodKey = new Date(Date.UTC(y,m,1)).toISOString().split('T')[0];

      kpi:{clientsServed:null, initiated:0, u1:0, u3:0, u5:0, u7:0, u9:0, totalApproachAttempts:null, revenue:0, g9009Ratio:null, linkageRateApproached:null, linkageRateInitiated:null},

      outreach:{totalAttempts:null,buckeyeAttempts:null,caresourceAttempts:null,uniqueMembers:null,g9009OnlyNoProgression:null},

async function parseLinkageDashboardWorkbook(buf){
  const sheets = await parseXlsxNamedSheets(buf, [/director\s*dashboard/i, /weekly\s*trends/i]);
  const ddName = Object.keys(sheets).find(n=>/director\s*dashboard/i.test(n));
  const wtName = Object.keys(sheets).find(n=>/weekly\s*trends/i.test(n));
  if(!ddName) throw new Error('Could not find a "Director Dashboard" tab in this workbook.');
  const dd = sheets[ddName];
  const wt = wtName ? sheets[wtName] : [];

  const kpi = {
    clientsServed: lkNum(lkExtractKpiTile(dd, /CLIENTS SERVED/i)),
    initiated:     lkNum(lkExtractKpiTile(dd, /SUCCESSFUL INITIATIONS/i)),
    u1:            lkNum(lkExtractKpiTile(dd, /U1\s*—\s*FACILITY INITIATED/i)),
    u3:            lkNum(lkExtractKpiTile(dd, /U3\s*—\s*COMMUNITY INITIATED/i)),
    totalApproachAttempts: lkNum(lkExtractKpiTile(dd, /TOTAL APPROACH ATTEMPTS/i)),
    u7:            lkNum(lkExtractKpiTile(dd, /REACHING U7/i)),
    revenue:       lkNum(lkExtractKpiTile(dd, /TOTAL REVENUE/i)),
    g9009Ratio:    lkNum(lkExtractKpiTile(dd, /G9009 RATIO/i)),
    u9:            lkNum(lkExtractKpiTile(dd, /REACHING U9/i)),
    u5:            lkNum(lkExtractKpiTile(dd, /MEMBERS LINKED/i)),
    linkageRateApproached: lkNum(lkExtractKpiTile(dd, /÷ All Approached/i)),
    linkageRateInitiated:  lkNum(lkExtractKpiTile(dd, /÷ Initiated/i)),
  };

  const pipe = lkExtractTable(dd, [t=>/^Stage$/i.test(t), t=>/^Code/i.test(t)]);
  const pipeline = pipe.rows.map(row=>({
    stage: lkCellText(row[1]), code: lkCellText(row[2]), count: lkNum(row[3]),
    rate: lkNum(row[4]), target: lkNum(row[5]), status: lkCellText(row[7]),
  }));

  const siteT = lkExtractTable(dd, [t=>/^Site$/i.test(t), t=>/^Approached$/i.test(t)]);
  const sites = siteT.rows.map(row=>({
    name: lkCellText(row[1]), approached: lkNum(row[2]), initiated: lkNum(row[3]),
    init_rate: lkNum(row[4]), u7: lkNum(row[5]), u9: lkNum(row[6]), revenue: lkNum(row[7]),
  })).filter(s=>s.name);

  const payerT = lkExtractTable(dd, [t=>/^Payer$/i.test(t), t=>/^Approached$/i.test(t)]);
  const payers = payerT.rows.map(row=>({
    name: lkCellText(row[1]), approached: lkNum(row[2]), initiated: lkNum(row[3]),
    init_rate: lkNum(row[4]), u7: lkNum(row[5]), u9: lkNum(row[6]), revenue: lkNum(row[7]),
  })).filter(p=>p.name && !/^total/i.test(p.name));

  const g9009T = lkExtractTable(dd, [t=>/^Category/i.test(t), t=>/^Count$/i.test(t)]);
  const g9009 = g9009T.rows.filter(row=>!/^total/i.test(lkCellText(row[1]))).map(row=>({
    cat: lkCellText(row[1]), count: lkNum(row[2]), pct: lkNum(row[3]), revenue: lkNum(row[4]),
  })).filter(c=>c.cat);

  const outreachRow = lkFindRow(dd,[t=>/^Metric$/i.test(t), t=>/^Count$/i.test(t)]);
  const outreach = {totalAttempts:0, buckeyeAttempts:0, caresourceAttempts:0, uniqueMembers:0, g9009OnlyNoProgression:0};
  if(outreachRow>=0){
    for(let r=outreachRow+1; r<dd.length; r++){
      const row=dd[r]||[]; const label=lkCellText(row[1]); if(!label) break;
      if(/^[▶⚠📋]/.test(label)) break;
      const val = lkNum(row[2]);
      if(/^Total outreach attempts/i.test(label)) outreach.totalAttempts=val;
      else if(/^Buckeye outreach/i.test(label)) outreach.buckeyeAttempts=val;
      else if(/^CareSource outreach/i.test(label)) outreach.caresourceAttempts=val;
      else if(/^Unique members with outreach/i.test(label)) outreach.uniqueMembers=val;
      else if(/G9009 only/i.test(label)) outreach.g9009OnlyNoProgression=val;
    }
  }

  const commT = lkExtractTable(dd, [t=>/^SITE$/i.test(t), t=>/DISCHARGED/i.test(t)]);
  const communityTransition = commT.rows.map(row=>({
    site: lkCellText(row[1]), linkageClients: lkNum(row[2]), discharged: lkNum(row[3]),
    medLOS: lkCellText(row[4]), exitUnder30: lkNum(row[5]), communityTransitions: lkNum(row[6]),
    conversionRate: lkNum(row[7]), vsTarget: lkCellText(row[8]),
  })).filter(c=>c.site);

  const weekly=[];
  if(wt.length){
    const hdrIdx = lkFindRow(wt,[t=>/^Week Start$/i.test(t)]);
    for(let r=hdrIdx+1; r<wt.length; r++){
      const row=wt[r]||[]; if(!row.length) continue;
      const weekStart=row[0], weekEnd=row[1];
      if(!(weekStart instanceof Date)) continue;
      const billingNotes=lkNum(row[2]), revenue=lkNum(row[3]);
      const u1=lkNum(row[4]), u3=lkNum(row[5]), initiated=lkNum(row[6]);
      const u5=lkNum(row[7]), u7=lkNum(row[8]), u9=lkNum(row[9]), g9009Count=lkNum(row[10]);
      if(billingNotes===0 && revenue===0 && initiated===0 && u5===0 && u7===0 && u9===0 && g9009Count===0) continue;
      weekly.push({weekStart, weekEnd, billingNotes, revenue, u1, u3, initiated, u5, u7, u9, g9009Count});
    }
  }

  return {kpi, pipeline, sites, payers, g9009, outreach, communityTransition, weekly};
}

function olComputeTrendMonths(anchorDate){
  const MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

  for(let i=11;i>=0;i--){

function olLedgerMaxMonth(ledger){
  const MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthLabels = Object.keys(ledger.months||{}).map(k => k.split('||')[1]).filter(Boolean);
  if (!monthLabels.length) return new Date();
  let maxD = null;
  monthLabels.forEach(m => {
    const parts = m.split(' ');
    if (parts.length !== 2) return;
    const mi = MONTH_ABBR.indexOf(parts[0]);

    const yr = 2000 + parseInt(parts[1], 10);
    const d = new Date(yr, mi, 1);

// Straight port of outcomes.html's parseNotes(), minus the clientMap-driven pathway lookup
// (Demographics isn't uploaded here, so that lookup is always empty — same fallback path
// Outcomes Dashboard itself already uses whenever Notes is uploaded without Demographics).
function olParseNotes(rows, trendMonths) {
  function bCode(raw) { const m=(raw||'').match(/\(([^)]+)\)/); return m?m[1].trim():''; }
  function estRev(row, pk) {
    const bill = row['Billable'];
    if (!bill && bill !== true && bill !== 1 && String(bill).toLowerCase() !== 'true') return 0;
    const code = bCode(row['Billing Code'] || '');
    const units = parseInt(row['Units Used']) || 0;
    if (/^H0038/.test(code)) return units * OL_H0038_RATE;
    return 0;
  }
  const progs = {};
  const pGet = k => {
    if (!progs[k]) progs[k] = {
      clients:new Set(), activeCl:new Set(),
      sudCl:new Set(), mhCl:new Set(),
      sessions:0, billable:0, minutes:0, revenue:0, f2f:0,
      mSessions:{}, mClients:{}, mNewAdm:{}, mRevenue:{}, mMinutes:{}, mNewReferralSrc:{},
      firstSeen:{}, firstSeenSrc:{}, firstBillable:{}, admitDateByClient:{}, payers:{}, staff:{}
    };
    return progs[k];
  };
  let minD=null, maxD=null;
  const unmapped = new Set();
  const CTP_STAFF = ['Mario Ybarbo'];
  const seenNoteIds = new Set();
  for (const r of rows) {
    const noteNum = r['Note #'];
    if (noteNum) {
      if (seenNoteIds.has(noteNum)) continue;
      seenNoteIds.add(noteNum);
    }
    const div      = (r['Division'] || '').trim();
    const performer= (r['Performed By'] || '').trim();
    const noteType = (r['Note Type'] || '').trim();
    const refSrc   = (r['Referral Source'] || '').trim();
    const clientNum= r['Client #'];
    const isCTP = CTP_STAFF.includes(performer) || noteType === 'CTP Care Coordination';
    let pk = (OL_PIMSY_REF_MAP[refSrc] || (isCTP ? 'als_ctp' : OL_PIMSY_DIV_MAP[div]));
    if (!pk || pk === 'archived') { if (div) unmapped.add(`div:${div}`); continue; }
    const p = pGet(pk);
    const svcD = r['Service Date'];
    const d = svcD instanceof Date ? svcD : (svcD ? new Date(svcD) : null);
    const ml = olMLabel(d);
    if (d && !isNaN(d)) { if (!minD||d<minD) minD=d; if (!maxD||d>maxD) maxD=d; }
    if (clientNum) {
      p.clients.add(clientNum);
      const active = r['Client Active'];
      if (active===true||active===1||String(active).toLowerCase()==='true') p.activeCl.add(clientNum);
      if (div==='SUD Community Services'||refSrc==='Self/No Referral') p.sudCl.add(clientNum);
      if (div==='MH Community Services') p.mhCl.add(clientNum);
      if (!p.firstSeen[clientNum]||(d&&!isNaN(d)&&d<p.firstSeen[clientNum])) { p.firstSeen[clientNum]=d; p.firstSeenSrc[clientNum]=refSrc||'Unknown'; }
    }
    p.sessions++;
    const bill = r['Billable'];
    if (bill===true||bill===1||String(bill).toLowerCase()==='true') {
      p.billable++;
      if (clientNum && d && !isNaN(d) && (!p.firstBillable[clientNum]||d<p.firstBillable[clientNum])) p.firstBillable[clientNum]=d;
    }
    const rowMinutes = parseInt(r['Duration in Minutes']) || 0;
    p.minutes += rowMinutes;
    const rowRev = estRev(r, pk);
    p.revenue += rowRev;
    const f2f = r['Face to Face'];
    if (f2f===true||f2f===1||String(f2f).toLowerCase()==='true') p.f2f++;
    if (ml && trendMonths.includes(ml)) {
      p.mSessions[ml] = (p.mSessions[ml] || 0) + 1;
      p.mRevenue[ml] = (p.mRevenue[ml] || 0) + rowRev;
      p.mMinutes[ml] = (p.mMinutes[ml] || 0) + rowMinutes;
      if (clientNum) { if (!p.mClients[ml]) p.mClients[ml]=new Set(); p.mClients[ml].add(clientNum); }
    }
    const payer = (r['Insurance Co.'] || 'Unknown').trim();
    p.payers[payer] = (p.payers[payer] || 0) + 1;
    const staff = (r['Performed By'] || '').trim();
    if (staff) {
      if (!p.staff[staff]) p.staff[staff]={sessions:0,clients:new Set(),billable:0};
      p.staff[staff].sessions++;
      if (clientNum) p.staff[staff].clients.add(clientNum);
      if (bill===true||bill===1||String(bill).toLowerCase()==='true') p.staff[staff].billable++;
    }
  }
  for (const p of Object.values(progs)) {
    for (const [cid,fd] of Object.entries(p.firstSeen)) {
      const ml = olMLabel(fd);
      if (ml && trendMonths.includes(ml)) {
        p.mNewAdm[ml] = (p.mNewAdm[ml] || 0) + 1;
        const src = p.firstSeenSrc[cid] || 'Unknown';
        if (!p.mNewReferralSrc[ml]) p.mNewReferralSrc[ml] = {};
        p.mNewReferralSrc[ml][src] = (p.mNewReferralSrc[ml][src] || 0) + 1;
      }
    }
  }
  return { progs, minD, maxD, unmapped:[...unmapped], total:rows.length };
}
// Converts the array-of-arrays rows this hub already extracted for the Linkage/Courts
// parsers (header row first) into the array-of-objects shape olParseNotes() (and outcomes.html's
// own parseNotes()) expect — row['Service Date'], row['Division'], etc.
function olRowsToObjects(rows){
  if(!rows || !rows.length) return [];
  const hdr = rows[0].map(h=>String(h||'').trim());
  return rows.slice(1).filter(r=>r && r.length).map(r=>{
    const o={};
    hdr.forEach((h,i)=>{ if(h) o[h]=r[i]; });
    return o;
  });
}
// Pulls the live 'program_ledger' row straight from Supabase (not through this hub's own
// sv()/lv() localStorage cache, since this hub never displays the ledger itself — it's purely
// relaying data Outcomes Dashboard owns), merges this upload's months in, and writes it
// straight back. Safe to re-run: ledgerUpsertMonth() overwrites by pk+month, so uploading the
// same or an overlapping month again never double-counts.
async function olMergeNotesIntoProgramLedger(objRows){
  const rows = await db.get('appdata', 'key=eq.program_ledger');
  let ledger = {months:{}, clientsSeen:{}, legacyDivisions:{}, ucodeMonths:{}, clientSetsCurrent:{}};
  if(rows && rows[0] && rows[0].value){
    try{ ledger = JSON.parse(rows[0].value); }catch(e){}
  }
  if (!ledger.clientSetsCurrent) ledger.clientSetsCurrent = {};
  const trendMonths = olComputeTrendMonths(olLedgerMaxMonth(ledger));
  const parsed = olParseNotes(objRows, trendMonths);
  Object.entries(parsed.progs).forEach(([pk, p]) => {
    Object.keys(p.mSessions||{}).forEach(month => {
      const sess = p.mSessions[month] || 0;
      const rev  = Math.round((p.mRevenue && p.mRevenue[month]) || 0);
      const clientSet = p.mClients[month] || new Set();
      const minutes = (p.mMinutes && p.mMinutes[month]) || 0;
      const newReferralSrc = (p.mNewReferralSrc && p.mNewReferralSrc[month]) || undefined;
      olLedgerUpsertMonth(ledger, pk, month, sess, rev, clientSet, minutes, newReferralSrc);
    });
    // PHASE 2 (9/16/26): snapshot this upload's per-program client sets — Total Admitted
    // (clients), Active Caseload (activeCl), and the SUD/MH split community's dashboard
    // needs. Overwritten wholesale on every upload (not merged), matching how Outcomes
    // Dashboard's own buildKpi() has always treated "hub period" — the range covered by
    // whatever Notes file was uploaded most recently, not a running lifetime total.
    ledger.clientSetsCurrent[pk] = {
      clients: [...p.clients],
      activeCl: [...p.activeCl],
      sudCl: [...p.sudCl],
      mhCl: [...p.mhCl],
      periodStart: parsed.minD ? parsed.minD.toISOString() : null,
      periodEnd: parsed.maxD ? parsed.maxD.toISOString() : null,
      uploadedAt: new Date().toISOString(),
    };
  });
  const saved = await db.upsert('appdata',{key:'program_ledger',value:JSON.stringify(ledger)},'key');
  return { ok: !!saved, monthsTouched: Object.values(parsed.progs).reduce((n,p)=>n+Object.keys(p.mSessions||{}).length,0), programsTouched: Object.keys(parsed.progs).length };
}

async tgS(id){

      const referralSource=(p[colReferral]||'').trim();
      const renewalName=(p[colRenewalName]||'').trim();
      const renewalType=(p[colRenewalType]||'').trim()||renewalName;
      const expiresOn=parseUSDate(p[colExpires]);
      const lastBillableDate=parseUSDate(p[colLastBillable]);
      if(clientId)knownClientIds.add(clientId.toLowerCase());
      if(!clientId||!peerRaw){continue;}
      const nameKey=peerRaw.toLowerCase().replace(/\s+/g,' ');
      const staff=resolveStaffByAlias(peerRaw)||staffByName[nameKey];
      if(!staff){
        noMatch++;
        if(!seenUnmatched.has(nameKey)){seenUnmatched.add(nameKey);unmatchedNames.push(peerRaw);}
        continue;
      }
      if(!expiresOn && !lastBillableDate){noDate++;continue;}
      if(!expiresOn)noDate++;
      parsedRows.push({
        clientId, staffName:staff.fn+' '+staff.ln, staffMgr:staff.mgr,
        renewalType, expiresOn, lastBillableDate, referralSource,
      });
    }

    const {toImport,toUpdate,dupes,reassignments}=ThriveRenewals.mergeRenewalImport(S.renewals,parsedRows,{dueDateFallbackDays:5,knownClientIds});
    const closed=toUpdate.filter(u=>u.reason==='discharged').length;
    M.prevRen={toImport,toUpdate,dupes,noMatch,noDate,closed,unmatchedNames,reassignments:reassignments||[]};
    modH();
  },
  // FIX: previously only applied rev.toImport and returned early whenever there were zero new
  // renewals — silently dropping every pending toUpdate (due-date / last-billable-date
  // refreshes on existing records) whenever a re-import found no brand-new renewals to add.
  // FIX (8/24): this used to be sync — it fired sv('r',S.renewals) without awaiting it, then
  // immediately showed a green "✓ Applied" toast and cleared M.prevRen, before the Supabase
  // write had actually completed or been confirmed. Root-caused via a live repro: the save
  // reported 200 OK yet the value read straight back from Supabase still showed the pre-import
  // status. Now async: it awaits sv() and only reports success (and only discards M.prevRen,
  // your one chance to retry) once the save is verified. Also dropped the per-row
  // db.update('renewals', u.id, dbPatch) calls that used to run here — that target a standalone
  // 'renewals' table that doesn't match the current schema (confirmed via console: every one of
  // those calls 400s with "Could not find the 'last_billable_date' column"), nothing anywhere in
  // any hub ever reads from it, and it was pure noise masking the real bug. The one write that
  // actually matters — and is now the only one this makes — is sv('r', S.renewals), the shared
  // appdata blob every hub's sync reads from.
  async confirmRenBulk(){
    const rev=M.prevRen;
    const nImport=rev?rev.toImport.length:0, nUpdate=rev?(rev.toUpdate||[]).length:0;
    if(!rev||(nImport===0&&nUpdate===0)){M.prevRen=null;render();return;}
    const btn=document.getElementById('renBulkConfirmBtn');
    if(btn){btn.disabled=true;btn.textContent='Saving…';}
    const nextRenewals=S.renewals.slice();
    const byId=new Map(nextRenewals.map((r,i)=>[r.id,i]));
    rev.toImport.forEach((r,i)=>{nextRenewals.push({id:Date.now()+i,clientId:r.clientId,peerSupporter:r.peerSupporter,dueDate:r.dueDate,lastBillableDate:r.lastBillableDate||null,referralSource:r.referralSource||null,manager:r.manager,renewalType:r.renewalType,notes:r.notes,status:'Pending',imported:true});});
    (rev.toUpdate||[]).forEach(u=>{
      // FIX (8/11): duplicate-cleanup patches only carry {id,status:'Removed'} — no date fields
      // at all — so this can no longer unconditionally write dueDate/lastBillableDate (that would
      // null out a record's real dates while removing it). Only include a field in the patch if
      // this particular update actually specified it.
      const patch={};
      if(u.dueDate!==undefined)patch.dueDate=u.dueDate;
      if(u.lastBillableDate!==undefined)patch.lastBillableDate=u.lastBillableDate;
      if(u.renewalType!=null)patch.renewalType=u.renewalType;
      if(u.referralSource!==undefined)patch.referralSource=u.referralSource;
      if(u.status!=null)patch.status=u.status;
      // FIX (9/14): mergeRenewalImport's toUpdate entries now carry peerSupporter/manager
      // whenever a reassignment was detected (see shared renewals module) — this was silently
      // dropped on the floor here, so the merge's fix alone wasn't enough on its own.
      if(u.peerSupporter!=null)patch.peerSupporter=u.peerSupporter;
      if(u.manager!=null)patch.manager=u.manager;
      const idx=byId.get(u.id);
      if(idx!=null)nextRenewals[idx]={...nextRenewals[idx],...patch};
    });
    const ok = await sv('r',nextRenewals);
    if(!ok){
      if(btn){btn.disabled=false;btn.textContent=`Apply ${nImport+nUpdate} Changes`;}
      showSaveError(`Save failed — nothing was applied. Your review is still here; try again, and check your connection if it keeps failing.`);
      return;
    }
    S.renewals=nextRenewals;
    recordImport('renewals_workbook', {row_count:nImport+nUpdate});
    M.prevRen=null;render();
    const t=document.createElement('div');t.textContent=`✓ Applied ${nImport+nUpdate} change${(nImport+nUpdate)!==1?'s':''} (${nImport} new, ${nUpdate} updated) — saved`;t.style.cssText='position:fixed;top:20px;right:20px;background:#1B5E20;color:#fff;padding:8px 14px;border-radius:6px;z-index:9999;font-family:inherit;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.2)';document.body.appendChild(t);setTimeout(()=>t.remove(),2200);
  },
  // FIX (8/25): same fire-and-forget gap as tgS()/upS() — Add Staff closed the modal and
  // showed the new row immediately, even when the Supabase write behind it silently failed,
  // so the person only existed in the browser that added them. Now awaits the save, rolls back
  // (and reopens the modal instead of losing what was typed) with a visible error on failure,
  // and blocks a duplicate Pimsy ID outright instead of silently overwriting that person's row.
  async sSt(){
    if(editLocked()){alert('Roster editing is locked — unlock it with a director/Brandon passcode first.');return;}
    const id=parseInt(document.getElementById('si')?.value);
    const fn=document.getElementById('sf')?.value.trim();
    const ln=document.getElementById('sl')?.value.trim();
    const mgr=document.getElementById('sm')?.value;
    const tp=document.getElementById('stp')?.value;
    const st=document.getElementById('sst')?.value;
    const reg=document.getElementById('sr')?.value.trim();
    if(isNaN(id)||id<=0){alert('Pimsy ID is required.');return;}
    if(!fn||!ln){alert('First and last name are required.');return;}
    if(MGR[mgr]&&MGR[mgr].prog==='Crisis Center'){alert('New Crisis Center staff are added in the Crisis Center hub (Staff Roster → + Add Staff), which also sets their sign-in email, role, and shift.');return;}
    const btn=document.getElementById('addStaffBtn');
    if(btn){btn.disabled=true;btn.textContent='Checking…';}
    const prevStaff=S.staff;
    const base=await freshStaff();
    if(base.some(s=>s.id===id)){
      const holder=base.find(s=>s.id===id);
      if(btn){btn.disabled=false;btn.textContent='Add Staff';}
      alert(`Pimsy ID ${id} is already on the roster (${holder.fn} ${holder.ln}, ${holder.status}). Double-check the ID before adding.${holder.status==='Inactive'?` If that's a bad entry (wrong ID typed in, not someone who actually left), find them in the roster and click Delete to free up ${id} — Deactivate alone doesn't release the ID.`:''}`);
      return;
    }
    // NEW (9/10): the ID check above never caught the actual recurring problem — two managers
    // each adding the SAME PERSON under two different Pimsy IDs (Tey Miller under Youngstown and
    // Dayton; same thing happened to Alicia Kirkman and Ashley Allen). A new hire really can share
    // a name with someone already on staff, so this warns rather than blocks — but it makes the
    // person adding stop and look at the existing row(s) before creating a second one.
    const nameKey=`${fn} ${ln}`.trim().toLowerCase();
    const nameMatches=base.filter(s=>`${(s.fn||'').trim()} ${(s.ln||'').trim()}`.trim().toLowerCase()===nameKey);
    if(nameMatches.length>0){
      const listing=nameMatches.map(s=>`#${s.id} — ${MGR[s.mgr]?.full||s.mgr||'no manager'}${s.reg?' / '+s.reg:''} — ${s.status}`).join('\n');
      const proceed=confirm(`${fn} ${ln} is already on the roster under a different Pimsy ID:\n\n${listing}\n\nIf this is the SAME person, cancel and use their existing row instead (update it, or Deactivate + Delete it first if it's the bad one) rather than adding a duplicate.\n\nOnly continue if this is genuinely a different person who happens to share this name.`);
      if(!proceed){
        if(btn){btn.disabled=false;btn.textContent='Add Staff';}
        return;
      }
    }
    if(btn){btn.textContent='Saving…';}
    S.staff=[...base,{id,fn,ln,mgr,tp,status:st,reg,nt:''}];
    const ok=await sv('s',S.staff);
    if(!ok){
      S.staff=prevStaff;
      if(btn){btn.disabled=false;btn.textContent='Add Staff';}
      showSaveError(`Save failed — ${fn} ${ln} was not added. Try again, and check your connection if it keeps failing.`);
      return;
    }
    M.type=null;
    render();
    const t=document.createElement('div');
    t.textContent=`✓ ${fn} ${ln} added — saved`;
    t.style.cssText='position:fixed;top:20px;right:20px;background:#1B5E20;color:#fff;padding:8px 14px;border-radius:6px;z-index:9999;font-family:inherit;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.2)';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),2200);
  },
};

document.addEventListener('click',e=>{const rm=document.getElementById('rm');if(rm&&!e.target.closest('#rm')&&!e.target.closest('.role-btn'))rm.style.display='none';});

// NEW (9/11, identity/access standardization phase 1): a remembered editUnlocked=true in this
// browser's localStorage no longer means anything on its own now that unlocking is real
// Supabase Auth — it needs a live, allowlisted session behind it. On load, if this browser
// remembers being unlocked, re-check that the Supabase Auth session is still valid and still
// belongs to an allowlisted reviewer; if not (session expired, signed out elsewhere, or this is
// a different browser/device that never actually signed in), silently re-lock instead of
// trusting the stale flag. Mirrors Director Hub's dhInit() session-restore check.
(async function dsAuthInit(){
  if(!S.editUnlocked) return;
  const {data}=await dsSb.auth.getSession();
  if(!data||!data.session){ S.editUnlocked=false; S.editUser=null; sv('editUnlocked',false); sv('editUser',null); renderV(); return; }
  const {data:reviewer,error:rErr}=await dsSb.from('reviewers').select('name,email').eq('id',data.session.user.id).single();
  if(rErr||!reviewer||!EDIT_ALLOWLIST.includes((reviewer.email||'').toLowerCase())){
    S.editUnlocked=false; S.editUser=null; sv('editUnlocked',false); sv('editUser',null);
    await dsSb.auth.signOut();
    renderV();
    return;
  }
  // Session is valid and still allowlisted — keep the remembered name in sync with the reviewers
  // table in case it was updated there since this browser last unlocked.
  if(reviewer.name && reviewer.name!==S.editUser){ S.editUser=reviewer.name; sv('editUser',reviewer.name); }
})();

render();
</script>
