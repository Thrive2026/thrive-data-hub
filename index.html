<style>
:root{
  --thrive-blue:#3c50a0; --thrive-blue-deep:#283c8c; --thrive-blue-dark:#1a2861;
  --thrive-yellow:#f0c814; --thrive-pink:#c83c8c; --thrive-green:#3cb43c;

  --warn:#a07e0a; --warn-soft:#fbf0c4;

<body>
<div class="shell">
  <nav class="side" id="sidebar"></nav>
  <div style="display:flex;flex-direction:column;min-width:0">
    <header class="topbar" id="hdr"></header>
    <main id="view"></main>
  </div>
</div>
<div id="mod"></div>
<script>
// ══════════════════════════════════════════════════════════
// SHARED RENEWALS MODULE (ThriveRenewals) — inlined from shared/renewals.js.
// Single source of truth for renewal status classification, purple/red/yellow
// display rules, reminder-email building, and the renewal-import match/update
// logic. This replaces separately hand-copied, independently-drifting copies
// of the same logic across Data & Staff Hub, Courts & Jail, and Community —
// the recurring "renewals are wrong again" reports were each caused by one
// copy getting a fix the others didn't. Fix it here once; every hub calls in.
// Usage in a hub's single-file build (as a separate script include):
//   [script tag with src="shared/renewals.js", closing script tag]
//   ... then call ThriveRenewals.classify(...), etc.
// ══════════════════════════════════════════════════════════
(function (root, factory) {
  const mod = factory();
  if (typeof module !== 'undefined' && module.exports) {
    module.exports = mod; // CommonJS / bundler
  } else {
    root.ThriveRenewals = mod; // plain script-tag include in a hub file
  }
})(typeof self !== 'undefined' ? self : this, function () {

  const BILLING_STATUS_TYPE = 'No Billable Note';

  /** Days-until-due badge (red/orange/yellow/green), for the raw "Due" column. */
  function dueBadge(due) {
    const d = Math.ceil((new Date(due) - new Date()) / 86400000);
    if (d < 0) return { l: 'OVERDUE', fg: '#7F1D1D', bg: '#FECACA', bd: '#EF4444' };
    if (d < 14) return { l: d + 'd', fg: '#991B1B', bg: '#FEE2E2', bd: '#FCA5A5' };
    if (d < 31) return { l: d + 'd', fg: '#92400E', bg: '#FEF3C7', bd: '#FCD34D' };
    if (d < 61) return { l: d + 'd', fg: '#78350F', bg: '#FFF7ED', bd: '#FDE68A' };
    return { l: d + 'd', fg: '#1B5E20', bg: '#C8E6C9', bd: '#6EE7B7' };
  }

  /**
   * Classifies a single renewal record into a status tier: graduated,
   * expired (red), due-soon (yellow), no-billable (purple), or hidden (no
   * flag). Purple ONLY applies to records with no due date at all — the
   * dedicated per-client billing-status record — never to a dated
   * renewal-type row just because it shares that client's stale Last
   * Billable Date.
   */
  function classify(r) {
    const hidden = { key: 'hidden', l: '', bg: '#fff', bd: '#e6dfd2', fg: '#1a2861' };
    if (!r) return hidden;
    const typeStr = `${r.renewalType || ''} ${r.renewalCategory || ''}`.toLowerCase();
    if (/graduat/.test(typeStr) || r.status === 'Completed') {
      return { key: 'graduated', l: 'Graduation', bg: '#DCFCE7', bd: '#22C55E', fg: '#14532D' };
    }
    const today = new Date(); today.setHours(0, 0, 0, 0);
    const due = r.dueDate ? new Date(r.dueDate) : null;
    const daysToDue = due && !isNaN(due.getTime()) ? Math.round((due - today) / 86400000) : null;
    if (daysToDue !== null && daysToDue < 0) {
      return { key: 'expired', l: `Expired ${Math.abs(daysToDue)}d ago`, bg: '#FECACA', bd: '#EF4444', fg: '#7F1D1D' };
    }
    if (daysToDue !== null && daysToDue <= 14) {
      return { key: 'due-soon', l: daysToDue === 0 ? 'Due today' : `Due in ${daysToDue}d`, bg: '#FEF9C3', bd: '#EAB308', fg: '#713F12' };
    }
    if (daysToDue === null && r.lastBillableDate) {
      const db = Math.floor((today - new Date(r.lastBillableDate)) / 86400000);
      if (db >= 21) return { key: 'no-billable', l: `No billable ${db}d`, bg: '#F3E8FF', bd: '#A855F7', fg: '#5B21B6' };
    }
    return hidden;
  }

  /** Due-column display text: the due date if there is one, else last-billable-date + days-since. */
  function dueCellText(r) {
    if (r.dueDate) return r.dueDate;
    if (r.lastBillableDate) {
      const days = Math.floor((new Date() - new Date(r.lastBillableDate)) / 86400000);
      return `Last billable ${r.lastBillableDate} (${days}d ago)`;
    }
    return '—';
  }

  /**
   * Collapses duplicate PURPLE-ONLY rows for the same client in a raw
   * display list — a client can have several renewal-type records sharing
   * the same stale last-billable date, each independently flagging purple.
   * Only collapses when purple is the ONLY reason a row is showing;
   * expired/due-soon/graduation rows are never collapsed here (see
   * buildReminderBody for the stronger one-row-per-client consolidation
   * used in reminder emails specifically).
   */
  function collapsePurpleDuplicates(list) {
    const seen = new Set();
    const out = [];
    list.forEach(r => {
      const cs = classify(r);
      if (cs.key === 'no-billable') {
        const key = `${(r.clientId || '').toLowerCase()}|${(r.peerSupporter || '').toLowerCase()}`;
        if (seen.has(key)) return;
        seen.add(key);
      }
      out.push(r);
    });
    return out;
  }

  /**
   * Builds the grouped reminder-email body for one peer supporter's open
   * renewals.
   *
   * FIX (8/11): a client flagged purple (no billable note in 21+ days) is
   * that client's ONE renewal — every other renewal-type row for the same
   * client (red/yellow/graduation) is suppressed rather than also
   * appearing in the email. Within red/yellow, a client with several
   * upcoming renewal-type rows is consolidated to their single most urgent
   * one (earliest due date) instead of one line per renewal type.
   *
   * @param {string} peerName
   * @param {Array} renewals - this peer supporter's open renewal records
   * @param {string} mgrFullName
   * @param {{includeNotes?: boolean}} [opts] - includeNotes: append r.notes
   *   to each line if present (Community Hub tracks per-renewal notes;
   *   Courts Hub does not).
   */
  function buildReminderBody(peerName, renewals, mgrFullName, opts) {
    opts = opts || {};
    const clientKey = r => `${(r.clientId || '').toLowerCase()}|${(r.peerSupporter || '').toLowerCase()}`;
    // FIX (8/17, per manager request): purple (no billable note 21+ days) used to supersede
    // EVERY other flag for a client, including a genuinely overdue (red) renewal. Managers
    // consider red the more urgent signal, so a client who is both overdue AND missing a
    // billable note now shows under red instead — purple only wins when there's no red renewal
    // for that client. Purple still supersedes yellow/graduation, unchanged.
    const redClients = new Set(renewals.filter(r => classify(r).key === 'expired').map(clientKey));
    const purpleClients = new Set(renewals.filter(r => classify(r).key === 'no-billable' && !redClients.has(clientKey(r))).map(clientKey));
    const byCat = { red: {}, yellow: {}, purple: [], grad: {} };
    renewals.forEach(r => {
      const cs = classify(r);
      const ck = clientKey(r);
      if (cs.key === 'no-billable') {
        if (redClients.has(ck)) return; // red takes priority for this client — don't also list them purple
        if (!byCat.purple.some(x => clientKey(x) === ck)) byCat.purple.push(r);
        return;
      }
      if (purpleClients.has(ck)) return; // purple supersedes any other flag for this client
      if (cs.key === 'expired') {
        const cur = byCat.red[ck];
        if (!cur || new Date(r.dueDate) < new Date(cur.dueDate)) byCat.red[ck] = r;
      } else if (cs.key === 'due-soon') {
        const cur = byCat.yellow[ck];
        if (!cur || new Date(r.dueDate) < new Date(cur.dueDate)) byCat.yellow[ck] = r;
      } else if (cs.key === 'graduated') {
        if (!byCat.grad[ck]) byCat.grad[ck] = r;
      }
    });
    const redList = Object.values(byCat.red), yellowList = Object.values(byCat.yellow), gradList = Object.values(byCat.grad);
    const sortByDate = arr => arr.slice().sort((a, b) => new Date(a.dueDate) - new Date(b.dueDate));
    const fmtRow = r => {
      const d = Math.ceil((new Date(r.dueDate) - new Date()) / 86400000);
      const when = d < 0 ? Math.abs(d) + ' days OVERDUE' : d === 0 ? 'due today' : d + ' days remaining';
      const noteSuffix = (opts.includeNotes && r.notes) ? `\n  Note: ${r.notes}` : '';
      return `• ${r.clientId} — ${r.renewalType} · Due ${r.dueDate} (${when})${noteSuffix}`;
    };
    const sections = [];
    if (redList.length) sections.push(`🔴 OVERDUE — please complete in Pimsy right away.\n\n${sortByDate(redList).map(fmtRow).join('\n')}`);
    if (yellowList.length) sections.push(`🟡 DUE WITHIN 14 DAYS\n\n${sortByDate(yellowList).map(fmtRow).join('\n')}`);
    if (byCat.purple.length) {
      const todayP = new Date(); todayP.setHours(0, 0, 0, 0);
      const fmtPurple = r => {
        const dbDays = r.lastBillableDate ? Math.floor((todayP - new Date(r.lastBillableDate)) / 86400000) : null;
        return `• ${r.clientId}${r.peerSupporter ? ' (' + r.peerSupporter + ')' : ''} — no billable note in ${dbDays != null ? dbDays : '21+'} days`;
      };
      sections.push(`🟣 NO BILLABLE NOTE IN 21+ DAYS — please reconnect or get notes entered.\n\n${byCat.purple.map(fmtPurple).join('\n')}`);
    }
    if (gradList.length) sections.push(`🟢 GRADUATION — keep up outreach.\n\n${gradList.map(fmtRow).join('\n')}`);
    const fname = peerName ? peerName.split(' ')[0] : 'there';
    const introExtra = opts.introExtra ? ' ' + opts.introExtra : '';
    return sections.length
      ? `Hi ${fname},\n\nPlease see the renewals below that need attention.${introExtra}\n\n${sections.join('\n\n')}\n\nReach out to ${mgrFullName || 'your manager'} with any questions.\n\nThanks,\nBrandon`
      : `Hi ${fname},\n\nNo renewals requiring action at this time.\n\nThanks,\nBrandon`;
  }

  /**
   * Merges freshly-parsed renewal rows into the existing stored renewal
   * list, returning {toImport, toUpdate, dupes} for the calling hub to
   * apply as-is. This is the matching/update logic that broke on 8/11 —
   * now lives in exactly one place instead of being hand-copied per hub.
   *
   * Matching rules:
   *  - Dated renewal-type rows match existing records by exact
   *    clientId+renewalType first (Pass 1); rows with no exact match try a
   *    RENEWAL FAMILY match next (Pass 2 — e.g. "Initial Treatment Plans"
   *    graduating to "Quarterly Treatment Plan," where the due date can
   *    legitimately jump ~90 days as part of a normal stage transition,
   *    which is far outside any due-date-proximity window); anything still
   *    unmatched falls back to due-date proximity within
   *    `dueDateFallbackDays` (Pass 3), to survive plain Pimsy relabeling
   *    with no real stage change.
   *  - The one-per-client billing-status ("No Billable Note") pseudo-record
   *    is matched and updated separately, by clientId+renewalType alone
   *    (never via the dated-renewal fallback — it has no due date, so
   *    due-date-proximity matching doesn't apply to it). THIS is the piece
   *    that broke on 8/11: it was excluded from the very lookup map it
   *    needed to be found in, so every re-import created a brand-new
   *    purple record instead of refreshing the stale one.
   *  - A one-time cleanup collapses any pre-existing duplicate records
   *    (billing-status OR dated) sharing a clientId+renewalType key —
   *    artifacts of the above bug, or of a relabel that fell outside any
   *    matching pass before this fix existed — down to the single most-
   *    current one, marking the rest Removed.
   *  - If `knownClientIds` is provided: any stored, non-Removed record for
   *    a clientId NOT in that set gets marked Removed. This is for clients
   *    who no longer appear ANYWHERE in the current export at all — i.e.
   *    fully discharged/final-noted and dropped from Pimsy's tracker —
   *    whose old records (including their purple billing-status one)
   *    would otherwise sit there forever, since every other pass here only
   *    ever matches/updates clients who ARE present in the current file.
   *    Pass this as every clientId seen in the raw file, even rows whose
   *    staff name failed to match the roster — a staff-matching miss is a
   *    different bug and must never be misread as "client discharged."
   *
   * @param {Array} existingRenewals - the hub's current stored renewal list
   * @param {Array<{clientId,staffName,staffMgr,renewalType,expiresOn,lastBillableDate,referralSource}>} parsedRows
   *   - already staff-matched rows from this hub's export-column parsing.
   *   Rows with no staffName should be filtered out by the caller before
   *   this is called (staff-roster matching is hub-specific).
   * @param {{dueDateFallbackDays?: number, knownClientIds?: Set<string>}} [opts]
   * @returns {{toImport: Array, toUpdate: Array, dupes: number}}
   */
  function mergeRenewalImport(existingRenewals, parsedRows, opts) {
    opts = opts || {};
    const DUE_DATE_FALLBACK_DAYS = opts.dueDateFallbackDays != null ? opts.dueDateFallbackDays : 5;

    // ONE-TIME CLEANUP (generalized 8/11 after the fact — the narrower version below only
    // caught duplicate BILLING_STATUS_TYPE records, but the exact same failure mode exists for
    // any dated renewal type: if a client already has two stored records sharing the same
    // clientId+renewalType key (an orphaned duplicate left over from before any of these fixes
    // existed — e.g. from a long-ago relabeling/due-date-jump that fell outside the Pass-2
    // fallback window and got imported as a brand-new record instead of matched to the old one),
    // the exact-match logic below can only ever find and update ONE of them (whichever the
    // `existingByKey` map's key last resolves to as it's built) — the other keeps sitting there
    // frozen at its old due date forever, correctly matched by nothing, removed by nothing. This
    // is what kept G-C-32906's Quarterly Treatment Plan stuck at a stale 7/30 due date even after
    // a fresh upload correctly updated a *different* stored record for the same client+type to
    // 11/2. Collapse ALL such duplicates now — billing-status and dated renewals alike — keeping
    // the highest-id (most recently created/imported) record per clientId+renewalType and
    // removing the rest.
    const toUpdate = [];
    // Reassignments detected during matching (existing record's owner differs from the current
    // row's) — surfaced back to the caller so a hub's import-review screen can show them BEFORE
    // they're applied, same as it already shows new/updated/skipped counts. A reassignment is
    // exactly the kind of change that's easy to get silently wrong (typo'd staff name, duplicate
    // person, wrong client matched) — it should be something a person glances at and confirms,
    // not something that only becomes visible after the fact via a support ticket.
    const reassignments = [];
    const dupesByKey = {};
    existingRenewals.forEach(r => {
      if (r.status === 'Removed') return;
      const ck = (r.clientId || '').trim().toLowerCase();
      const k = `${ck}|${(r.renewalType || '').trim().toLowerCase()}`;
      (dupesByKey[k] = dupesByKey[k] || []).push(r);
    });
    Object.values(dupesByKey).forEach(recs => {
      if (recs.length < 2) return;
      const keeper = recs[0].renewalType === BILLING_STATUS_TYPE
        // Billing-status duplicates: keep whichever has the most recent lastBillableDate —
        // that's the one reflecting current reality, regardless of which was imported last.
        ? recs.reduce((a, b) => new Date(a.lastBillableDate || 0) > new Date(b.lastBillableDate || 0) ? a : b)
        // Dated-renewal duplicates: keep the highest id (most recently created/imported) —
        // there's no reliable date-based signal here since a stale duplicate's dueDate is
        // exactly the wrong thing to trust.
        : recs.reduce((a, b) => (b.id > a.id ? b : a));
      recs.forEach(r => { if (r.id !== keeper.id) toUpdate.push({ id: r.id, status: 'Removed', reason: 'duplicate' }); });
    });
    const removedDupeIds = new Set(toUpdate.map(u => u.id));

    const existingByKey = {}, existingByClient = {}, existingBillingByKey = {};
    const consumedExisting = new Set();
    existingRenewals.forEach(r => {
      if (r.status === 'Removed' || removedDupeIds.has(r.id)) return;
      const ck = (r.clientId || '').trim().toLowerCase();
      const k = `${ck}|${(r.renewalType || '').trim().toLowerCase()}`;
      if (r.renewalType === BILLING_STATUS_TYPE) { existingBillingByKey[k] = r; return; }
      existingByKey[k] = r;
      (existingByClient[ck] = existingByClient[ck] || []).push(r);
    });

    // DISCHARGE DETECTION: a client who no longer appears ANYWHERE in the current export —
    // not just missing one renewal type, but gone entirely — has almost certainly been final-
    // noted and closed out in Pimsy. Nothing else in this function ever revisits a client who
    // isn't in the current file (every pass above only matches/updates clients who ARE present),
    // so without this, their old records — including the purple billing-status one — just sit
    // there forever, e.g. an ever-growing "no billable Xd" flag for someone who was discharged
    // weeks ago and has no open case to reconnect with. `knownClientIds` must be every clientId
    // seen in the raw file regardless of whether their staff name matched the roster — a
    // staff-matching miss is a different bug and must never be misread as a discharge.
    if (opts.knownClientIds) {
      existingRenewals.forEach(r => {
        if (r.status === 'Removed' || removedDupeIds.has(r.id)) return;
        const ck = (r.clientId || '').trim().toLowerCase();
        if (!opts.knownClientIds.has(ck)) toUpdate.push({ id: r.id, status: 'Removed', reason: 'discharged' });
      });
    }

    const toImport = [];
    let dupes = 0;
    const seen = new Set();
    const clientBilling = {};
    const usableRows = [];

    parsedRows.forEach(row => {
      if (!row.clientId || !row.staffName) return;
      if (row.lastBillableDate) {
        clientBilling[row.clientId.toLowerCase()] = {
          clientId: row.clientId, peerSupporter: row.staffName, manager: row.staffMgr,
          lastBillableDate: row.lastBillableDate,
        };
      }
      if (!row.expiresOn) return;
      const key = `${row.clientId.toLowerCase()}|${row.renewalType.toLowerCase()}`;
      if (seen.has(key)) { dupes++; return; }
      seen.add(key);
      usableRows.push({ ...row, key });
    });

    // Pass 1 — exact clientId+renewalType matches claim their record first,
    // before any due-date fallback runs, regardless of file row order.
    const pendingFallback = [];
    usableRows.forEach(row => {
      const existing = existingByKey[row.key];
      if (existing) {
        consumedExisting.add(existing.id);
        // FIX (9/14): a reassignment in Pimsy (same client, same renewal type, new peer
        // supporter) used to leave existing.peerSupporter/manager untouched forever — this
        // pass only ever refreshed dates. That's the root cause of the weekly "shows on the
        // old person's list, never shows up on the new person's" reports: the record kept
        // whichever staff name it was first imported under, no matter how many times Pimsy
        // was re-exported with the new owner. Now the current row's staff assignment always
        // wins on a match, same as its dates do.
        const changed = existing.dueDate !== row.expiresOn
          || existing.lastBillableDate !== (row.lastBillableDate || null)
          || existing.referralSource !== (row.referralSource || null)
          || existing.peerSupporter !== row.staffName
          || existing.manager !== row.staffMgr;
        if (existing.peerSupporter && existing.peerSupporter !== row.staffName) {
          reassignments.push({ clientId: existing.clientId, renewalType: existing.renewalType, from: existing.peerSupporter, to: row.staffName });
        }
        if (changed) {
          toUpdate.push({ id: existing.id, dueDate: row.expiresOn, lastBillableDate: row.lastBillableDate || null, referralSource: row.referralSource || null, peerSupporter: row.staffName, manager: row.staffMgr });
        } else {
          dupes++;
        }
      } else {
        pendingFallback.push(row);
      }
    });

    // Pass 2 — for rows still unmatched, try matching by RENEWAL FAMILY: some renewal types
    // are just different life-stage labels for the exact same tracked item (Initial Treatment
    // Plans -> Quarterly Treatment Plan once a client graduates past their first plan; NPPC 26 ->
    // Client Intake Forms, per the relabeling this file already had a comment about). When a
    // client progresses stages, the due date can legitimately jump by ~90 days (a full quarter),
    // which is far outside any due-date-proximity window — so without this, the OLD stage's
    // record orphans forever (never matched, never removed) while a brand-new record gets
    // created for the new stage. This is exactly what happened to H-C-33536 and T-C-36753 on
    // 8/11: both had graduated from "Initial Treatment Plans" to "Quarterly Treatment Plan," and
    // the stale Initial record just sat there showing an increasingly-overdue date that no
    // longer existed anywhere in the source file. Matching by family FIRST (before the date-
    // proximity fallback) means a stage transition always supersedes the prior stage's record,
    // regardless of how far the due date moved.
    function familyKey(renewalType) {
      const t = (renewalType || '').toLowerCase();
      if (/treatment plan/.test(t)) return 'treatment_plan';
      if (/nppc/.test(t) || /client intake/.test(t)) return 'intake_forms';
      return null; // no known family grouping — only exact-type or date-proximity matching applies
    }
    const stillPending = [];
    pendingFallback.forEach(row => {
      const fk = familyKey(row.renewalType);
      if (!fk) { stillPending.push(row); return; }
      const ck = row.clientId.toLowerCase();
      const candidates = (existingByClient[ck] || []).filter(r => !consumedExisting.has(r.id) && familyKey(r.renewalType) === fk);
      if (candidates.length === 0) { stillPending.push(row); return; }
      // If more than one same-family candidate somehow exists (shouldn't under normal use —
      // a client only has one open treatment plan at a time — but stay defensive), prefer the
      // one with the latest existing due date, since that's the most-recently-progressed stage.
      const best = candidates.reduce((a, b) => new Date(b.dueDate || 0) > new Date(a.dueDate || 0) ? b : a);
      consumedExisting.add(best.id);
      // FIX (9/14): same staff-assignment fix as Pass 1 — a family-match (stage transition)
      // must also carry forward the row's current peer supporter/manager, not just dueDate.
      const changed = best.dueDate !== row.expiresOn
        || best.renewalType !== row.renewalType
        || best.lastBillableDate !== (row.lastBillableDate || null)
        || best.referralSource !== (row.referralSource || null)
        || best.peerSupporter !== row.staffName
        || best.manager !== row.staffMgr;
      if (best.peerSupporter && best.peerSupporter !== row.staffName) {
        reassignments.push({ clientId: best.clientId, renewalType: row.renewalType, from: best.peerSupporter, to: row.staffName });
      }
      if (changed) {
        toUpdate.push({ id: best.id, dueDate: row.expiresOn, renewalType: row.renewalType, lastBillableDate: row.lastBillableDate || null, referralSource: row.referralSource || null, peerSupporter: row.staffName, manager: row.staffMgr });
      } else {
        dupes++;
      }
    });

    // Pass 3 — only rows with no exact label match and no family match attempt the due-date
    // fallback, only against records Pass 1/2 didn't already claim.
    stillPending.forEach(row => {
      const ck = row.clientId.toLowerCase();
      const candidates = (existingByClient[ck] || []).filter(r => !consumedExisting.has(r.id));
      let best = null, bestDiff = Infinity;
      candidates.forEach(r => {
        if (!r.dueDate) return;
        const diff = Math.abs((new Date(row.expiresOn) - new Date(r.dueDate)) / 86400000);
        if (diff <= DUE_DATE_FALLBACK_DAYS && diff < bestDiff) { best = r; bestDiff = diff; }
      });
      if (best) {
        consumedExisting.add(best.id);
        // FIX (9/14): same staff-assignment fix as Pass 1/2 for the due-date-proximity fallback.
        const changed = best.dueDate !== row.expiresOn
          || best.renewalType !== row.renewalType
          || best.lastBillableDate !== (row.lastBillableDate || null)
          || best.referralSource !== (row.referralSource || null)
          || best.peerSupporter !== row.staffName
          || best.manager !== row.staffMgr;
        if (best.peerSupporter && best.peerSupporter !== row.staffName) {
          reassignments.push({ clientId: best.clientId, renewalType: row.renewalType, from: best.peerSupporter, to: row.staffName });
        }
        if (changed) {
          toUpdate.push({ id: best.id, dueDate: row.expiresOn, renewalType: row.renewalType, lastBillableDate: row.lastBillableDate || null, referralSource: row.referralSource || null, peerSupporter: row.staffName, manager: row.staffMgr });
        } else {
          dupes++;
        }
      } else {
        toImport.push({
          clientId: row.clientId, peerSupporter: row.staffName, manager: row.staffMgr,
          renewalType: row.renewalType, dueDate: row.expiresOn, lastBillableDate: row.lastBillableDate || null,
          referralSource: row.referralSource || null, notes: '', status: 'Pending',
        });
      }
    });

    // TYPE-LEVEL CLEANUP (8/17): the existing discharge check above only catches a client who's
    // gone from the export ENTIRELY. It missed the far more common case: the client is still
    // there, but one specific renewal type they used to have isn't listed for them anywhere in
    // this file anymore (resolved directly in Pimsy, graduated past it, etc.) — that old record
    // just sat there orphaned forever, showing an ever-increasing "expired Xd ago," which is
    // exactly the stale-renewals pattern managers kept reporting. Confirmed with Brandon that the
    // Pimsy export is a complete list of every open renewal type per client, not a due-date-scoped
    // subset — so a type's absence here is meaningful, not just an artifact of what this
    // particular file happened to include. Any existing dated record for a client who DOES appear
    // in this file, but that wasn't claimed by Pass 1/2/3 above, gets marked Removed the same way.
    if (opts.knownClientIds) {
      existingRenewals.forEach(r => {
        if (r.status === 'Removed' || r.status === 'Completed' || removedDupeIds.has(r.id) || consumedExisting.has(r.id)) return;
        if (r.renewalType === BILLING_STATUS_TYPE) return; // derived from lastBillableDate, not a literal Pimsy renewal type
        const ck = (r.clientId || '').trim().toLowerCase();
        if (opts.knownClientIds.has(ck)) toUpdate.push({ id: r.id, status: 'Removed', reason: 'type-not-in-latest-export' });
      });
    }

    // Billing-status pseudo-record — one per client, dueDate stays null on
    // purpose, so classify() only ever evaluates it for purple.
    Object.values(clientBilling).forEach(b => {
      const key = `${b.clientId.toLowerCase()}|${BILLING_STATUS_TYPE.toLowerCase()}`;
      if (seen.has(key)) return;
      seen.add(key);
      const existing = existingBillingByKey[key];
      if (existing) {
        // FIX (9/14): same staff-assignment fix — the purple billing-status pseudo-record is
        // the one most likely to be the ONLY renewal record a newly-reassigned client has, so
        // this was the clearest case of "reassigned, never shows up on the new person's list."
        if (existing.peerSupporter && existing.peerSupporter !== b.peerSupporter) {
          reassignments.push({ clientId: existing.clientId, renewalType: BILLING_STATUS_TYPE, from: existing.peerSupporter, to: b.peerSupporter });
        }
        if (existing.lastBillableDate !== b.lastBillableDate || existing.peerSupporter !== b.peerSupporter || existing.manager !== b.manager) {
          toUpdate.push({ id: existing.id, dueDate: null, lastBillableDate: b.lastBillableDate, peerSupporter: b.peerSupporter, manager: b.manager });
        } else {
          dupes++;
        }
        return;
      }
      toImport.push({
        clientId: b.clientId, peerSupporter: b.peerSupporter, manager: b.manager,
        renewalType: BILLING_STATUS_TYPE, dueDate: null, lastBillableDate: b.lastBillableDate,
        notes: '', status: 'Pending',
      });
    });

    return { toImport, toUpdate, dupes, reassignments };
  }

  return {
    BILLING_STATUS_TYPE,
    dueBadge,
    classify,
    dueCellText,
    collapsePurpleDuplicates,
    buildReminderBody,
    mergeRenewalImport,
  };
});

// ══════════════════════════════════════════════════════════
// STAFF ALIAS TABLE — canonical name-resolution lookup against the shared
// Supabase `staff_aliases` table (see staff_aliases.sql). This is the actual
// fix for "why is this person's data missing" being a recurring debugging
// session: a new name variant is now a one-row insert in Supabase, not a
// code change replicated across every hub. This hub is the primary upload
// point for the org, so it's the highest-value place for this to be
// authoritative — SUP_NAME_ALIASES (further down this file) is kept as a
// redundant local fallback only in case the network call hasn't landed yet.
// ══════════════════════════════════════════════════════════
let STAFF_ALIAS_MAP = {}; // normalized-alias-string -> staff_id, loaded once per session
// FIX (9/14): now strips parenthetical annotations (e.g. "Martha (HOLD) Continenza" — ops
// appends a status like "(HOLD)" mid-name in the Pimsy export for cases waiting on Medicaid
// verification) and invisible/zero-width characters, matching the ceNorm() normalizer that
// matchEngagementToRoster/matchNameValueToRoster already use for exactly this reason. Before
// this fix, ANY staff member with an ops annotation in their exported name would silently fail
// every match — alias table included, since resolveStaffByAlias runs through this same
// function — regardless of whether an alias row existed for them. Safe for existing stored
// staff_aliases rows: none of them contain literal parentheses, so this is a no-op for every
// alias already saved and only changes behavior for names that actually have "(...)" in them.
const INVISIBLE_NAME_CHARS_RE = new RegExp('[' + [0x200B,0x200C,0x200D,0xFEFF,0x00A0].map(function(c){return String.fromCharCode(c);}).join('') + ']', 'g');
const normAliasName = n => n ? String(n).replace(/\([^)]*\)/g,' ').replace(INVISIBLE_NAME_CHARS_RE,' ').trim().replace(/\s+/g,' ').toLowerCase() : '';
async function loadStaffAliasMap(){
  const map = {};
  S.staff.forEach(s=>{ if(s.fn&&s.ln) map[normAliasName(s.fn+' '+s.ln)] = s.id; });
  try{
    const r = await fetch(`${SB_URL}/rest/v1/staff_aliases?select=staff_id,alias_norm`,{headers:{apikey:SB_KEY,Authorization:'Bearer '+SB_KEY}});
    if(r.ok){
      const rows = await r.json();
      rows.forEach(row=>{ if(row.staff_id!=null) map[row.alias_norm] = row.staff_id; });
    }
  }catch(e){ console.warn('[loadStaffAliasMap]', e); }
  STAFF_ALIAS_MAP = map;
}
function resolveStaffByAlias(rawName){
  const key = normAliasName(rawName);
  const id = STAFF_ALIAS_MAP[key];
  if(id==null) return null;
  return S.staff.find(s=>s.id===id) || null;
}

async function syncFromSupabase(){
  if(SB_URL.includes('YOUR_PROJECT')||SB_KEY.includes('YOUR_ANON'))return;
  const allAppdata=await db.get('appdata');
  if(allAppdata){
    const byKey={};allAppdata.forEach(r=>{byKey[r.key]=r.value;});
    const parse=(k)=>{try{return byKey[k]?JSON.parse(byKey[k]):null;}catch(e){return null;}};
   const staff=parse('staff');if(staff&&Array.isArray(staff)&&staff.length>0){
      // Merge by ID rather than overwrite — a stale Supabase snapshot saved before someone
      // was added to the default roster (SDEF) would otherwise wipe them back out on every
      // load, even though initStaff() had just correctly added them locally.
      const seedDefaults=(s)=>{
        const seed=PROVIDER_MAP_DATA[s.id]||{};
        return {
          gender:(s.gender!=null&&s.gender!=='')?s.gender:(seed.gender||''),
          city:(s.city!=null&&s.city!=='')?s.city:(seed.city||''),
          county:(s.county!=null&&s.county!=='')?s.county:(seed.county||''),
          zip:(s.zip!=null&&s.zip!=='')?s.zip:(seed.zip||''),
          program:(s.program!=null&&s.program!=='')?s.program:(seed.program||''),
        };
      };
      const backfilled=staff.map(s=>({...s,...seedDefaults(s)}));
      const savedIds=new Set(staff.map(s=>s.id));
      // Crisis Center rows are excluded from the re-add: the Crisis Center hub owns them, so a
      // person it deleted must not be resurrected from this file's default roster.
      const missingFromDefault=SDEF.map(s=>({...s,status:s.status||'Active',...seedDefaults(s)})).filter(s=>!savedIds.has(s.id)&&!isCCOwned(s));
      S.staff = missingFromDefault.length ? [...backfilled, ...missingFromDefault] : backfilled;
      // Only write back when this load actually changed something. Writing the whole roster on
      // every page open was a standing last-write-wins risk against saves from the other hubs.
      if(JSON.stringify(S.staff)!==JSON.stringify(staff)) sv('s',S.staff);
      else { try{localStorage.setItem('ths_s',JSON.stringify(S.staff));}catch(e){} }
    }
    const pd=parse('pd');if(pd&&Object.keys(pd).length>0){S.pd=pd;sv('p',S.pd);}
    const up=parse('uploads');if(up){Object.entries(up).forEach(([p,v])=>{S.up[p]={...(S.up[p]||{}),...v};});sv('up',S.up);}
    const supOv=parse('sup_overrides');if(supOv){S.supOverrides={...S.supOverrides,...supOv};sv('supov',S.supOverrides);}
    const pmOv=parse('pm_overrides');if(pmOv){S.pmOverrides={...S.pmOverrides,...pmOv};sv('pmov',S.pmOverrides);}
    const upAt=parse('uploads_at');if(upAt){S.upAt={...S.upAt,...upAt};sv('upAt',S.upAt);}
    const impreg=parse('import_registry');if(impreg){S.impreg={...S.impreg,...impreg};sv('impreg',S.impreg);}
    const ren=parse('renewals');if(ren&&Array.isArray(ren)&&ren.length>0){S.renewals=cleanStaleLocationNotes(ren);sv('r',S.renewals);}
    const supImp=parse('sup_import');if(supImp&&Object.keys(supImp).length>0){S.supImport=foldLegacyCredentials(foldSupAliases({...(S.supImport||{}),...supImp}));sv('supimp',S.supImport);}
    const hospD=parse('hospital_data');if(hospD){S.hospData=hospD;sv('hospData',S.hospData);}
    const linkData=parse('linkage_data');if(linkData){S.linkageData=linkData;sv('linkageData',S.linkageData);}
    // linkage_history is the actual durable multi-month store — linkage_data above is just a
    // single latest-snapshot convenience copy, kept for backward compatibility. Same load
    // pattern as 'pd' above: fully replace S.linkageHistory with the server's copy, since the
    // server is authoritative here, then merge in whatever this session commits on top of it.
    const linkHist=parse('linkage_history');if(linkHist&&Object.keys(linkHist).length>0){S.linkageHistory=linkHist;sv('linkageHistory',S.linkageHistory);}
    // Raw note pool — same "server is authoritative, merge session on top" pattern as history
    // above. This is what makes weekly delta uploads safe: it's the accumulated memory a new
    // upload gets merged into, rather than each upload starting from a blank slate.
    const linkRaw=parse('linkage_notes_raw');if(linkRaw&&Object.keys(linkRaw).length>0){S.linkageNotesRaw=linkRaw;sv('linkageNotesRaw',S.linkageNotesRaw);}
  }
  const remoteTasks=await db.get('tasks');
  if(remoteTasks){
    const remoteIds=new Set(remoteTasks.map(t=>t.id));
    const localOnly=(S.tasks||[]).filter(t=>!remoteIds.has(t.id));
    S.tasks=[...remoteTasks.map(t=>({id:t.id,title:t.title,desc:t.description,notes:t.notes,assignedTo:t.assigned_to,assignedBy:t.assigned_by,priority:t.priority,dueDate:t.due_date,status:t.status,created:t.created})),...localOnly];
    sv('t',S.tasks);
  }
  const remoteNotes=await db.get('notes');
  if(remoteNotes){
    const grouped={};remoteNotes.forEach(n=>{if(!grouped[n.staff_id])grouped[n.staff_id]=[];grouped[n.staff_id].push({text:n.text,author:n.author,date:n.created_at?.slice(0,10),id:n.id,ts:n.created_at});});
    Object.entries(grouped).forEach(([staffId,entries])=>{S.noteLogs[staffId]=entries;});
    sv('nlogs',S.noteLogs);
  }
  const remoteSup=await db.get('supervision');
  if(remoteSup){const supMap={};remoteSup.forEach(s=>{supMap[s.key]=s.completed;});S.supOverrides={...(S.supOverrides||{}),...supMap};sv('supov',S.supOverrides);}
  await loadStaffAliasMap(); // re-populate against the live roster now that S.staff may have changed
  render();
}

// One-time cleanup for renewal records imported before the parser fix — those records had
// their "notes" field set to "Location: <case status>" (e.g. "Location: Provisional"), which
// is just the client's case-status field from the export, not a useful note for a reminder
// email. New imports no longer populate this. Strips it from anything already stored, leaving
// any OTHER note text untouched. Never removes or merges renewal records themselves.
function cleanStaleLocationNotes(list){
  return list.map(r=>{
    if(r.notes && /^Location:\s*/i.test(r.notes.trim())) return {...r,notes:''};
    return r;
  });
}

// FIX (8/24): sv() used to fire the Supabase write and return immediately, with nothing
// awaiting it — so a caller like confirmRenBulk() would show "✓ Applied" and let the user
// navigate/reload before the network request had actually finished or been confirmed. That's
// the confirmed root cause behind renewals reporting a successful save while the old data was
// still what Supabase actually had. sv() is now async and resolves to true/false so a caller
// that cares about the outcome (anything showing a success message, like confirmRenBulk) can
// await it and only report success once the write is verified to have actually landed. Existing
// call sites that don't await it still work exactly as before — this is not a breaking change,
// just an opt-in for callers that need to know the real result.
async function sv(k,v){
  try{localStorage.setItem('ths_'+k,JSON.stringify(v));}catch(e){}
  const sharedKeys={'s':'staff','p':'pd','r':'renewals','t':'tasks','nlogs':'notes_log','supov':'sup_overrides','supimp':'sup_import','pmov':'pm_overrides','up':'uploads','upAt':'uploads_at','hospData':'hospital_data','linkageData':'linkage_data','linkageHistory':'linkage_history','linkageNotesRaw':'linkage_notes_raw','impreg':'import_registry'};
  if(sharedKeys[k]&&typeof db!=='undefined'&&SB_KEY.length>50){
    const saved = await db.upsert('appdata',{key:sharedKeys[k],value:JSON.stringify(v)},'key');
    if(!saved){
      console.error(`[sv] Save FAILED for '${sharedKeys[k]}' — this change only exists in your browser right now and will be lost on reload until it saves successfully.`);
      return false;
    }
    return true;
  }
  return true;
}
// Small visible warning for a failed save — console.error alone is too easy to miss, and this
// class of bug (a save silently not landing in Supabase) is exactly what a manager has no way
// to notice without something on-screen telling them.
function showSaveError(msg){
  const t=document.createElement('div');
  t.textContent=`⚠ ${msg}`;
  t.style.cssText='position:fixed;top:20px;right:20px;background:#B71C1C;color:#fff;padding:10px 16px;border-radius:6px;z-index:9999;font-family:inherit;font-size:12px;font-weight:600;box-shadow:0 4px 14px rgba(0,0,0,0.3);max-width:360px';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),8000);
}
function lv(k,d){try{const v=localStorage.getItem('ths_'+k);if(v!==null)return JSON.parse(v);return d;}catch(e){return d;}}

// ══════════════════════════════════════════════════════════
// IMPORT REGISTRY — Data Catalog build-out (added 9/14/26, per the Data Ingestion
// Architecture plan). One shared appdata key ('import_registry') recording, per dataset,
// when it was last uploaded, by whom, the source filename, and how many rows landed —
// so the Data Catalog tab can show real freshness instead of a hidden/guessed status.
// This is purely additive: it doesn't touch any existing parsing/commit logic, it just
// records a small envelope alongside it. See recordImport() call sites in each commit*
// function below, and catalogV() for the tab that reads this back.
// ══════════════════════════════════════════════════════════
function recordImport(datasetKey, meta){
  meta = meta || {};
  const entry = {
    uploaded_at: new Date().toISOString(),
    uploaded_by: S.editUser || S.role || 'Unknown',
    source_filename: meta.source_filename || S._lastFile || null,
    row_count: (typeof meta.row_count === 'number') ? meta.row_count : null,
    period_label: meta.period_label || null,
    // Added 9/16/26 per Brandon's request: the actual latest date of DATA this upload
    // covers, distinct from uploaded_at (when someone clicked upload). Lets whoever's
    // doing the next upload see at a glance where the last one left off, instead of
    // guessing from the upload timestamp alone. Format varies by dataset (a real date,
    // a month, or a period-tab label) — fmtDataThrough() below normalizes for display.
    // null for datasets that aren't date-ranged data at all (e.g. Renewals, which is a
    // current-state snapshot, not a time series) — those intentionally show '—'.
    data_through: meta.data_through || null,
  };
  S.impreg = {...(S.impreg||{}), [datasetKey]: entry};
  sv('impreg', S.impreg);
}
// Normalizes the several date-ish shapes data_through can arrive in (a plain
// YYYY-MM-DD, a YYYY-MM month, or an already-human label like "Jun 2026" or a
// period-tab string) into one consistent display string.
function fmtDataThrough(v){
  if(!v) return '—';
  const s=String(v).trim();
  let m=s.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m){ const d=new Date(+m[1],+m[2]-1,+m[3]); return isNaN(d)?s:d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
  m=s.match(/^(\d{4})-(\d{2})$/);
  if(m){ const d=new Date(+m[1],+m[2]-1,1); return isNaN(d)?s:d.toLocaleDateString('en-US',{month:'long',year:'numeric'}); }
  return s;
}

// QUICKBOOKS P&L PARSER — moved here verbatim from Director Hub (director-hub_9.html) on
// 9/22/26, per the Data Ingestion Architecture plan's "riskiest of the already-built-pattern
// moves" step (see ecosystem-next-steps-tracker.md). This is a byte-for-byte copy of Director
// Hub's parseQuickBooksPL() and its helpers — QB_DIVISION_TARGETS, qbCellText,
// qbFindColByLabel, QB_MONTH_RE, qbDetectColumnGroups, qbFindRowIdxByLabel, qbCellNum — with
// nothing adapted, because these are pure functions (fileRows in, plain object out) with zero
// dependency on Director Hub's own globals. Verified before this move via a Node harness run
// against the two real "Profit and Loss by Class" exports Brandon provided (July and August
// 2026): both parse cleanly with no thrown errors and no mismatchWarning, confirming this real
// export shape is fully compatible with the existing column/row-label-matching logic as-is.
//
// What changes here vs. Director Hub's own copy is ONLY what happens AFTER parsing — see
// slotFilePL()/commitPL() in the H object below and the "P&L by Class" upload card in the
// data-entry modal. This upload writes new monthly entries into the same shared Supabase
// appdata key ('director_financial_history') that Director Hub already reads on every load
// (syncFinancialHistoryFromSupabase(), ~700ms after boot) and already re-derives its own
// "current" snapshot from (promoteMostRecentCompletePeriod()) — so Director Hub needs NO code
// changes to pick up a P&L uploaded from here, and its own upload button keeps working
// unchanged in parallel during the transition. This upload deliberately does NOT touch the

const fmt$ = n => (n<0?'-$':'$') + Math.abs(n).toLocaleString('en-US',{maximumFractionDigits:0});
const QB_DIVISION_TARGETS = [
  {key:'community',   name:'Community',        totalLabel:'Total for Community',        exactLabel:'Community'},
  {key:'hospitals',    name:'Hospitals',        totalLabel:'Total for Hospitals',        exactLabel:'Hospitals'},
  {key:'linkage',      name:'Linkage',          totalLabel:'Total for Linkage',          exactLabel:'Linkage'},
  {key:'clinical',     name:'Clinical',         totalLabel:'Total for Clinical',         exactLabel:'Clinical'},
  {key:'justice',      name:'Justice Involved', totalLabel:'Total for Justice Involved', exactLabel:'Justice Involved'},
  {key:'callcenters',  name:'Call Centers',     totalLabel:'Total for Call Centers',     exactLabel:'Call Centers'},

function qbCellText(v){ return String(v==null?'':v).trim(); }
function qbFindColByLabel(headerRow, label, start, end){
  if(start==null) start = 0;

  for(let i=start;i<=end;i++){ if(qbCellText(headerRow[i])===label) return i; }

const QB_MONTH_RE = /^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)[a-zA-Z]*\.?\s+\d{4}$/i;

  const groupRowIdx = classHeaderRowIdx - 1;

  const groupRow = fileRows[groupRowIdx] || [];
  const labels = [];
  let last = '';
  for(let c=0;c<numCols;c++){
    const v = qbCellText(groupRow[c]);
    if(v) last = v;
    labels[c] = last;
  }
  const distinctMonthLabels = new Set(labels.filter(l=>QB_MONTH_RE.test(l)));
  if(distinctMonthLabels.size < 2) return null;

  let curLabel = null, curStart = 0;
  for(let c=0;c<numCols;c++){
    if(labels[c] !== curLabel){
      if(curLabel !== null) groups.push({label:curLabel, start:curStart, end:c-1});
      curLabel = labels[c]; curStart = c;
    }
  }

function qbFindRowIdxByLabel(rows, label, {fromRow=0, last=false}={}){
  let found=-1;
  for(let r=fromRow;r<rows.length;r++){
    if(qbCellText((rows[r]||[])[0])===label){ found=r; if(!last) break; }
  }
  return found;
}
function qbCellNum(rows, r, c){
  if(r<0||c<0) return 0;
  const v = (rows[r]||[])[c];
  if(v==null||v==='') return 0;
  if(typeof v==='number') return v;
  const n = parseFloat(String(v).replace(/[,$]/g,''));
  return isNaN(n)?0:n;
}
function parseQuickBooksPL(fileRows){
  let headerRowIdx = -1;
  for(let r=0;r<Math.min(fileRows.length,20);r++){
    const texts = (fileRows[r]||[]).map(qbCellText);
    if(texts.includes('Community') && texts.includes('Linkage')){ headerRowIdx = r; break; }
  }
  if(headerRowIdx<0) throw new Error('Could not find the class header row (expected "Community" and "Linkage" as column headers). The export format may have changed — check this is a "Profit and Loss by Class" report.');
  const headerRow = fileRows[headerRowIdx];
  const numCols = headerRow.length;

  const incomeRow     = qbFindRowIdxByLabel(fileRows, 'Total for Income', {fromRow:headerRowIdx});
  const cogsRow        = qbFindRowIdxByLabel(fileRows, 'Total for Cost of Goods Sold', {fromRow:headerRowIdx, last:true});
  const personnelRow  = qbFindRowIdxByLabel(fileRows, 'Total for Personnel', {fromRow:headerRowIdx});
  const expensesRow   = qbFindRowIdxByLabel(fileRows, 'Total for Expenses', {fromRow:headerRowIdx});
  if([incomeRow,cogsRow,personnelRow,expensesRow].some(x=>x<0)){
    throw new Error('Could not find one of the required subtotal rows ("Total for Income", "Total for Cost of Goods Sold", "Total for Personnel", "Total for Expenses"). The export format may have changed.');
  }

  function resolveColIn(target, start, end){
    let c = qbFindColByLabel(headerRow, target.totalLabel, start, end);
    if(c<0) c = qbFindColByLabel(headerRow, target.exactLabel, start, end);
    if(c<0) throw new Error(`Could not find a "${target.exactLabel}" column in the P&L export.`);
    return c;
  }

  function buildDivisionsForRange(start,end){
    const divisions = {};
    QB_DIVISION_TARGETS.forEach(t=>{
      const col = resolveColIn(t, start, end);
      divisions[t.key] = {
        name: t.name,
        income:    qbCellNum(fileRows, incomeRow, col),
        cogs:      qbCellNum(fileRows, cogsRow, col),
        directExp: qbCellNum(fileRows, expensesRow, col),
        personnel: qbCellNum(fileRows, personnelRow, col),
      };
    });
    let localAdminCol = qbFindColByLabel(headerRow, 'Total for Administrative', start, end);
    if(localAdminCol<0) localAdminCol = qbFindColByLabel(headerRow, 'Administrative', start, end);
    const adminPool   = localAdminCol>=0 ? qbCellNum(fileRows, expensesRow, localAdminCol) : 0;
    const adminIncome = localAdminCol>=0 ? qbCellNum(fileRows, incomeRow, localAdminCol) : 0;
    let localTotalCol = -1;
    for(let i=start;i<=end;i++){ if(qbCellText(headerRow[i])==='Total') localTotalCol=i; }
    const totalRev = localTotalCol>=0
      ? qbCellNum(fileRows, incomeRow, localTotalCol)
      : Object.values(divisions).reduce((s,d)=>s+d.income,0) + adminIncome;
    return {divisions, adminPool, totalRev, adminIncome};
  }

  const columnGroups = qbDetectColumnGroups(fileRows, headerRowIdx, numCols);
  let monthly = null, overall = null;
  if(columnGroups && columnGroups.length){
    const monthGroups = columnGroups.filter(g=>QB_MONTH_RE.test(g.label));
    const totalGroup = columnGroups.find(g=>/^total$/i.test(g.label));
    if(monthGroups.length >= 2){
      monthly = monthGroups.map(g=>{
        const built = buildDivisionsForRange(g.start, g.end);
        return { period: g.label, adminPool: built.adminPool, totalRev: built.totalRev, divisions: built.divisions };
      });
      overall = totalGroup
        ? buildDivisionsForRange(totalGroup.start, totalGroup.end)
        : monthly.reduce((acc,m)=>{
            QB_DIVISION_TARGETS.forEach(t=>{
              acc.divisions[t.key] = acc.divisions[t.key] || {name:t.name,income:0,cogs:0,directExp:0,personnel:0};
              acc.divisions[t.key].income     += m.divisions[t.key].income;
              acc.divisions[t.key].cogs       += m.divisions[t.key].cogs;
              acc.divisions[t.key].directExp  += m.divisions[t.key].directExp;
              acc.divisions[t.key].personnel  += m.divisions[t.key].personnel;
            });
            acc.adminPool += m.adminPool; acc.totalRev += m.totalRev;
            return acc;
          }, {divisions:{}, adminPool:0, totalRev:0});
    }
  }
  if(!overall) overall = buildDivisionsForRange(0, numCols-1);

  let period = null;
  for(let r=0;r<Math.min(fileRows.length,6);r++){
    const v = qbCellText((fileRows[r]||[])[0]);
    if(v && /\d{4}/.test(v) && !/profit and loss/i.test(v) && !/thrive/i.test(v)){ period = v; break; }
  }

  const sumCheck = Object.values(overall.divisions).reduce((s,d)=>s+d.income,0) + overall.adminIncome;
  const mismatch = Math.abs(sumCheck - overall.totalRev);

  return {
    period, adminPool: overall.adminPool, totalRev: overall.totalRev, divisions: overall.divisions,
    monthly,
    mismatchWarning: mismatch>5
      ? `Division totals + Administrative income (${fmt$(sumCheck)}) don't quite match the file's Grand Total (${fmt$(overall.totalRev)}) — off by ${fmt$(mismatch)}. Numbers were still imported; worth spot-checking against the source file.`
      : null,
  };
}
// Same math as Director Hub's snapshotFinancialHistoryFor(), but returns a plain history entry
// object instead of mutating Director Hub's FINANCIAL_HISTORY/localStorage — this hub has no
// live "current financial" view of its own to keep in sync, it only ever writes history points
// for Director Hub to read.
function plHistoryEntryFor(period, divisionsIn, adminPool, totalRev){
  const divisions = {};
  Object.keys(divisionsIn).forEach(function(key){
    const d = divisionsIn[key];
    const netOpDirect = d.income - d.cogs - d.directExp;
    const allocOH = totalRev ? (d.income/totalRev)*adminPool : 0;
    const trueNet = netOpDirect - allocOH;
    divisions[key] = {
      name: d.name,
      income: d.income, cogs: d.cogs, directExp: d.directExp, personnel: d.personnel,
      trueMargin: d.income ? trueNet/d.income : 0,
      grossMargin: d.income ? (d.income-d.cogs)/d.income : 0,
      personnelRatio: d.income ? d.personnel/d.income : 0,
    };
  });
  return { period: period, updated: new Date().toISOString().split('T')[0], adminPool: adminPool, totalRev: totalRev, divisions: divisions };
}

    const code=String(r[COL_CODE]||'').trim();

    const paid=r[COL_PAID];
    const charge=r[COL_CHARGE];
    const client=String(r[COL_CLIENT]||'');
    const pnorm=norm(provider);
    if(!bucket.pstats[pnorm])bucket.pstats[pnorm]={display:String(provider).trim().replace(/\s+/g,' '),revenue:0,rendered:0,paidTotal:0,partialAdj:0,encounters:0,billable:0,uncompensated:0,pendingByCode:{},clients:new Set(),mgr:resolveMgr(provider)};
    const ps=bucket.pstats[pnorm];
    ps.encounters++;
    if(client)ps.clients.add(client);
    if(BASE_BILLABLE_CODES.has(bcode)){
      // Revenue basis is Total Charge (billed), not Total Paid (collected) — per Brandon, Sep 2026,
      // to match how the Clinical Breakeven Model's own targets were built ("Invoiced=True
      // records") and to avoid claims-payment lag making the most recent month look artificially
      // empty every time (Total Paid can trail the actual clinical work by weeks). `rendered` is
      // now the same figure as `revenue` (kept as a separate field since older snapshots and any
      // downstream readers already expect both); `paidTotal` keeps the collected amount around
      // separately for reference/reconciliation, but nothing derives "revenue" from it anymore.
      // `uncompensated` now means "billable-code encounter with no charge entered yet" (a
      // charge-entry-lag signal) rather than "not yet paid."
      const chargeNum=parseFloat(charge)||0;
      const paidNum=paid?(parseFloat(paid)||0):0;
      ps.rendered+=chargeNum;
      ps.paidTotal+=paidNum;
      if(chargeNum>0){
        ps.revenue+=chargeNum;ps.billable++;
        if(chargeNum>paidNum)ps.partialAdj+=(chargeNum-paidNum);
        (codeChargeSamples[bcode]=codeChargeSamples[bcode]||[]).push(chargeNum);
      }
      else{
        ps.uncompensated++;
        ps.pendingByCode[bcode]=(ps.pendingByCode[bcode]||0)+1;
      }
    }
  }

  function median(nums){
    if(!nums||!nums.length) return null;
    const s=nums.slice().sort((a,b)=>a-b);
    const mid=Math.floor(s.length/2);
    return s.length%2 ? s[mid] : (s[mid-1]+s[mid])/2;
  }
  // Per-code expected rate, used to forecast revenue still sitting uncharged (see
  // ps.pendingByCode above) — median of every real priced encounter for that code found
  // anywhere in this file. Requires at least 5 samples before trusting a code's rate at all;
  // a code with fewer real examples just contributes nothing to the forecast rather than a
  // shaky estimate from 1-2 data points.
  const codeRates = {};
  Object.keys(codeChargeSamples).forEach(function(code){
    if(codeChargeSamples[code].length>=5) codeRates[code]=median(codeChargeSamples[code]);
  });

  const MGRS=['Brian','Cara','John','Luke','Rachel','Jessica','Angelica','Deb','Muneera'];
  // monthSpan is always exactly 1 now — each bucket is a single calendar month by
  // construction, so monthly_avg and revenue are the same figure (kept as separate fields
  // since every downstream renderer already reads monthly_avg).
  //
  // Team-level totals (revenue/monthly_avg/staff_billed/client_count/etc.) are computed from
  // ACTIVE providers only — same isInactiveProvider/LIVE_STAFF_STATUS_MAP gate every renderer
  // already applies to the per-provider list via activeProviders() before display. Before this
  // fix, that gate only ran at render time on `out[mgr].providers`, while the team-level totals
  // here were summed from the full, unfiltered `provs` — so a departed/inactive clinician's
  // billing was excluded from the "Team Mo. Avg" KPI tile (which re-sums the filtered provider
  // list at render time) but still baked into the manager-level total that gets snapshotted into
  // PIMSY_HISTORY for the Monthly/Weekly Trend charts. Two numbers for "the same" team, for the
  // same period, that couldn't agree. Filtering here instead makes every downstream reader of
  // out[mgr].revenue/monthly_avg (current tiles AND history) consistent by construction. The
  // full, unfiltered `provs` list is still what's stored in `providers:` below, so nothing that
  // already re-filters at render time changes — this only fixes the team-level aggregate fields.
  // Forecasted revenue for one provider: their already-charged revenue, plus the expected value
  // of every billable-code encounter that doesn't have a charge entered yet (ps.pendingByCode),
  // using that code's real median rate from codeRates above. A code with too few real samples to
  // trust (see codeRates' 5-sample floor) just contributes its actual $0 rather than a guess —
  // this makes the forecast a floor/best-estimate, not an upper bound, when rates are thin.

    let add=0;

      const rate=codeRates[code];

  function buildMgrOut(pstats){
    const out={};

      const provs=Object.values(pstats).filter(p=>p.mgr===mgr);
      const activeProvs=provs.filter(p=>!isInactiveProvider(p.display));
      const totalRev=activeProvs.reduce((a,p)=>a+p.revenue,0);
      const totalForecast=activeProvs.reduce((a,p)=>a+forecastFor(p),0);
      const totalRendered=activeProvs.reduce((a,p)=>a+p.rendered,0);
      const totalPaid=activeProvs.reduce((a,p)=>a+p.paidTotal,0);
      const totalPartialAdj=activeProvs.reduce((a,p)=>a+p.partialAdj,0);
      const totalUncompensated=activeProvs.reduce((a,p)=>a+p.uncompensated,0);
      const allClients=new Set();activeProvs.forEach(p=>p.clients.forEach(c=>allClients.add(c)));
      out[mgr]={
        revenue:Math.round(totalRev*100)/100,
        monthly_avg:Math.round(totalRev*100)/100,
        // Forecasted total for this month — actual charged revenue plus the expected value of
        // billable encounters still waiting on a charge to be entered (charge-entry lag). See
        // forecastFor above. Equals `revenue` once every billable encounter has a real charge.
        revenue_forecast:Math.round(totalForecast*100)/100,
        client_count:allClients.size,
        staff_billed:activeProvs.length,
        encounters:activeProvs.reduce((a,p)=>a+p.encounters,0),
        billable_encounters:activeProvs.reduce((a,p)=>a+p.billable,0),
        rendered:Math.round(totalRendered*100)/100,
        paid:Math.round(totalPaid*100)/100,
        partial_adjustment:Math.round(totalPartialAdj*100)/100,
        uncompensated_count:totalUncompensated,
        providers:provs.sort((a,b)=>b.revenue-a.revenue).map(p=>({
          name:p.display,
          revenue:Math.round(p.revenue*100)/100,
          monthly_avg:Math.round(p.revenue*100)/100,
          revenue_forecast:Math.round(forecastFor(p)*100)/100,
          clients:p.clients.size,
          encounters:p.encounters,
          billable_encounters:p.billable,
          uncompensated:p.uncompensated,
          rendered:Math.round(p.rendered*100)/100,
          paid:Math.round(p.paidTotal*100)/100,
          partial_adjustment:Math.round(p.partialAdj*100)/100,
        }))
      };
    });
    return out;
  }

  const today=new Date();
  const MONTH_ABBR=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  function fmtMonthYear(d){ return `${MONTH_ABBR[d.getMonth()]} ${d.getFullYear()}`; }
  const generated=today.toISOString().split('T')[0];

  const monthKeys = Object.keys(monthBuckets).sort();
  const latestKey = monthKeys[monthKeys.length-1];
  const monthly = {};
  monthKeys.forEach(mk=>{
    const bucket = monthBuckets[mk];
    const [y,m] = mk.split('-').map(Number);
    const daysInMonth = new Date(y, m, 0).getDate();
    const dataThroughDay = bucket.maxDate.getDate();
    monthly[mk] = {
      period: bucket.minDate.getMonth()===bucket.maxDate.getMonth() && bucket.minDate.getFullYear()===bucket.maxDate.getFullYear()
        ? fmtMonthYear(bucket.minDate)
        : `${fmtMonthYear(bucket.minDate)}–${fmtMonthYear(bucket.maxDate)}`,
      generated,
      periodEndDate: bucket.maxDate.toISOString().split('T')[0],
      managers: buildMgrOut(bucket.pstats),
      daysInMonth,
      dataThroughDay,
      // Only the most-recent month in the file can be "partial" — every earlier month in the
      // same file is, by definition, already closed out by the time later dates appear in it.
      partial: (mk===latestKey) && (dataThroughDay < daysInMonth),
    };
  });

  // Which month gets PROMOTED to the live dashboard view (KPI tiles' live-snapshot fallback,
  // the Per-Clinician Goal Tracker, "At Target"/"Below 70%") — normally just the chronologically
  // latest month in the file, same as before. But a real Klip export from Brandon (2026-09-04)
  // had exactly one day of the *next* calendar month mixed in (a handful of Sep 1 rows, all
  // ADMIN/non-billable or same-day-uncharged) — technically newer than Aug, so it silently
  // dethroned a complete, real August as "live" and replaced it with a nearly-empty single day,
  // zeroing out every provider row and the two tiles that read the live snapshot instead of
  // Trends history. A real reporting month reaches a handful of days of its own data almost
  // immediately; a leaked day or two from an export boundary essentially never does. Require the
  // latest month to have at least MIN_LIVE_DAYS days of its own data before trusting it as
  // "current" — otherwise stay pinned to the previous (real) month. The thin month is NOT
  // discarded — it's still in `monthly` below and still backfills Trends history once it has
  // enough of its own data to stand on its own.
  const MIN_LIVE_DAYS = 3;
  let promoteKey = latestKey;
  if(latestKey && monthKeys.length > 1 && monthly[latestKey].dataThroughDay < MIN_LIVE_DAYS){
    promoteKey = monthKeys[monthKeys.length-2];
  }
  const latest = promoteKey ? monthly[promoteKey] : null;
  return {
    period: latest ? latest.period : 'Unknown period',
    generated,
    // A totally-failed parse (no valid dated rows found at all) used to fall back to today's
    // wall-clock date here — which made a broken upload look like it covered a period "in the
    // future" relative to any real month, permanently blocking every good upload afterward from
    // ever being accepted as newer (see the isNewerOrSame self-heal below; this is the
    // other half of that fix, so it can't happen again). null here correctly signals "no real
    // period at all" instead of a fake date that out-ranks real ones.
    periodEndDate: latest ? latest.periodEndDate : null,
    managers: latest ? latest.managers : {},
    partial: latest ? latest.partial : true,
    monthly, // every month found in the file — nothing discarded, used to backfill Trends
  };
}

// PIMSY_HISTORY_MAX mirrors Director Hub's own constant — roughly 6 months of weekly Klip
// snapshots kept in director_pimsy_history.
const PIMSY_HISTORY_MAX = 26;
// Builds one director_pimsy_history entry from a parsed Klip month, mirroring Director Hub's
// own snapshotPimsyHistory() entry shape exactly (date/period/partial/teamTotals) so Director
// Hub's existing Trends charts read this hub's uploads with zero changes on that end.
function klipHistoryEntryFor(monthEntry){
  const date = (monthEntry && (monthEntry.periodEndDate || monthEntry.generated)) || new Date().toISOString().split('T')[0];
  const teamTotals = {};
  const managers = (monthEntry && monthEntry.managers) || {};
  Object.keys(managers).forEach(function(mgrKey){
    const md = managers[mgrKey];
    teamTotals[mgrKey] = {
      revenue: md.revenue || 0,
      revenue_forecast: md.revenue_forecast != null ? md.revenue_forecast : (md.revenue || 0),
      monthly_avg: md.monthly_avg || 0,
      staff_billed: md.staff_billed || 0,
      client_count: md.client_count || 0
    };
  });
  return { date: date, period: monthEntry && monthEntry.period, partial: !!(monthEntry && monthEntry.partial), teamTotals: teamTotals };
}

const CLINICAL_ROSTER = [
  { fn:'Amanda',   ln:'Nelson'   },
  { fn:'Lauren',   ln:'Breadon'  },
  { fn:'Patricia', ln:'Graf'     },
  { fn:'Katie',    ln:'Gassaway' },
  { fn:'Muneera',  ln:'Novak'    },
  { fn:'Kaitlynd', ln:'Donato'   },
  { fn:'Danielle', ln:'Ricketts' },
];
const clinNorm = n => n ? String(n).trim().replace(/\s+/g,' ').toLowerCase() : '';
const CLINICAL_TARGETS = { 'Amanda Nelson':5827, 'Lauren Breadon':3663, 'Patricia Graf':3088, 'Katie Gassaway':2691, 'Muneera Novak':0, 'Kaitlynd Donato':7213, 'Danielle Ricketts':2691 };

// the Clinical Team Dashboard's Monthly Goals sheet — same alias-resolution pattern as
// SUP_NAME_ALIASES elsewhere, so the target still resolves regardless of which name a given
// data source uses.
const CLINICAL_TARGET_ALIASES = { 'katheryn gassaway':'Katie Gassaway' };
function clinicalTargetForName(name){

  const norm = String(name||'').trim().replace(/\s+/g,' ').toLowerCase();
  const canonical = CLINICAL_TARGET_ALIASES[norm];
  if(canonical && CLINICAL_TARGETS[canonical]!=null) return CLINICAL_TARGETS[canonical];
  for(const k in CLINICAL_TARGETS){ if(k.trim().toLowerCase()===norm) return CLINICAL_TARGETS[k]; }

const CLINICAL_RATE_TABLE = { '90791':125.28, '90832':60.49, '90834':78.63, '90837':115.35 };
const CLINICAL_CPST_RATE = 88.12; // per hour
// Weekly targets, uniform across the team per the Weekly Clinical Goals workbook's own
// "Discharge Weekly Goal" (10) / "Outreach Weekly Goal" (15) columns. Flag to Brandon if these
// should actually vary by clinician — the source workbook didn't show variation.
const CLINICAL_DISCHARGE_WEEKLY_GOAL = 10;
const CLINICAL_OUTREACH_WEEKLY_GOAL = 15;
const WEEKS_PER_MONTH = 4.345; // 365.25/12/7 — used to turn a weekly goal into a monthly one
function parseClinicalNotesExport(rows){
  const hdr = rows[0].map(h=>String(h||'').trim());
  const idx = name => hdr.findIndex(h=>h.toLowerCase()===name.toLowerCase());
  const colDate=idx('Service Date'), colBy=idx('Performed By'), colType=idx('Note Type'), colCode=idx('Billing Code'), colDur=idx('Duration in Minutes');
  if(colDate<0||colBy<0||colType<0||colCode<0){
    throw new Error('Not a recognized Notes export — need Service Date, Performed By, Note Type, and Billing Code columns.');
  }
  function toDate(v){
    if(v==null||v==='') return null;
    // FIX (9/22/26, Data Hub port): Director Hub feeds this function rows from ITS OWN
    // parseXlsxNamedSheets(buffer, patterns, true) — the `true` (keepFullDate) makes date-styled
    // cells come back as "YYYY-MM-DD" strings, which the branch below already handled. Data Hub's
    // own parseXlsxNamedSheets (no such flag) instead returns a real JS Date object for a
    // date-styled cell — without this check, `+v` on a Date silently reads as its epoch-millis
    // value and gets treated as an Excel serial number, producing a garbage date far outside any
    // real month and making every row in the file fail the target-month filter below. Same
    // instanceof check Data Hub's own parseLinkageNotesExport already had to add for the same
    // reason — found and fixed during real-file verification before this went live, not after.
    if(v instanceof Date) return isNaN(v)?null:v;
    if(typeof v==='string' && /^\d{4}-\d{2}-\d{2}/.test(v)) return new Date(v.slice(0,10)+'T00:00:00Z');
    const n=+v;
    if(!isNaN(n) && typeof v!=='string') return new Date(Date.UTC(1899,11,30) + Math.floor(n)*86400000); // floor, not round - avoids rolling a PM timestamp into the next day
    const d=new Date(v); return isNaN(d)?null:d;
  }
  // Alias-aware roster lookup — CLINICAL_TARGET_ALIASES already handled this mismatch for goal
  // lookups (the Notes export lists her as "Katheryn Gassaway", not "Katie Gassaway"), but this
  // separate roster gate never got the same treatment, so her rows were being silently dropped
  // as "not a clinical-team clinician" before they ever reached the goal lookup. Same fix here.
  const byName={};
  CLINICAL_ROSTER.forEach(s=>{ byName[clinNorm(s.fn+' '+s.ln)]=s; });
  Object.entries(CLINICAL_TARGET_ALIASES).forEach(([aliasKey,canonicalName])=>{
    const canonicalKey = clinNorm(canonicalName);
    if(byName[canonicalKey]) byName[aliasKey]=byName[canonicalKey];
  });
  // Notes exports commonly cover several months in one file (verified against a real 3-month
  // pull) — Clinical Goals is a single-month mid-month pace view, so restrict to whichever
  // month is most recent in the file rather than summing everything together.
  let maxDate=null;
  for(let i=1;i<rows.length;i++){
    const d=toDate(rows[i]&&rows[i][colDate]);
    if(d && (!maxDate||d>maxDate)) maxDate=d;
  }
  const targetY = maxDate?maxDate.getUTCFullYear():null, targetM = maxDate?maxDate.getUTCMonth():null;
  const acc={}; // key -> accumulator
  // FIX (9/22/26, Data Hub port): the roster gate below used to just `continue` on a non-roster
  // name with nothing recorded about it — the "unmatched" list this function returns has always
  // been shown on the (Director Hub) preview screen as "⚠️ N unmatched", but N was always 0 no
  // matter what was actually in the file, since nothing was ever added to it. Found during
  // real-file verification for this relocation, not introduced by it. unmatchedCounts now tracks
  // any NON-roster name attached to a row with a clinically-shaped billing code (one of
  // CLINICAL_RATE_TABLE's codes, or CPST) in the target month — i.e. someone whose billing
  // pattern looks like real clinical work that isn't landing in Clinical Goals because their name
  // doesn't match CLINICAL_ROSTER (the exact Katheryn/Katie Gassaway-style drift the alias table
  // above already had to patch once). This deliberately does NOT flag every non-roster name in
  // the file — Linkage/Community staff show up in this same export constantly and are supposed
  // to be skipped silently — only names that look like they should have matched a clinician.
  const unmatchedCounts = {};
  for(let i=1;i<rows.length;i++){
    const row=rows[i]; if(!row) continue;
    const rawName=String(row[colBy]||'').trim(); if(!rawName) continue;
    const key=clinNorm(rawName);
    const staff=byName[key];
    const d = toDate(row[colDate]);
    if(!d || d.getUTCFullYear()!==targetY || d.getUTCMonth()!==targetM) continue; // outside target month
    const billCode=String(row[colCode]||'');
    if(!staff){
      const looksClinical = Object.keys(CLINICAL_RATE_TABLE).some(code=>billCode.includes(code)) || /cpst/i.test(billCode);
      if(looksClinical) unmatchedCounts[rawName] = (unmatchedCounts[rawName]||0)+1;
      continue; // not a clinical-team clinician — irrelevant rows (PRS, etc.) skipped silently
    }
    if(!acc[key]) acc[key]={ name: staff.fn+' '+staff.ln, units:{}, cpstMinutes:0, discharge:0, outreach:0, weekly:[0,0,0,0,0] };
    const a=acc[key];
    const noteType=String(row[colType]||'').trim();
    let matchedCode=null;
    for(const code in CLINICAL_RATE_TABLE){ if(billCode.includes(code)){ matchedCode=code; break; } }
    if(matchedCode){
      a.units[matchedCode]=(a.units[matchedCode]||0)+1;
      if(d){ const wk=Math.min(4, Math.floor((d.getUTCDate()-1)/7)); a.weekly[wk]+=CLINICAL_RATE_TABLE[matchedCode]; }
    } else if(/cpst/i.test(billCode)){
      const mins = parseFloat(row[colDur])||0;
      a.cpstMinutes += mins;
      if(d){ const wk=Math.min(4, Math.floor((d.getUTCDate()-1)/7)); a.weekly[wk]+=(mins/60)*CLINICAL_CPST_RATE; }
    }
    if(noteType==='Discharge Summary') a.discharge++;
    if(noteType==='Phone Note' || noteType==='Phone Note-No Contact') a.outreach++;
  }
  const daysInMonth = maxDate ? new Date(Date.UTC(maxDate.getUTCFullYear(), maxDate.getUTCMonth()+1, 0)).getUTCDate() : 30;
  const dayOfMonth = maxDate ? maxDate.getUTCDate() : daysInMonth;
  const matched=[];
  const unmatched = Object.keys(unmatchedCounts).sort((a,b)=>unmatchedCounts[b]-unmatchedCounts[a]);
  Object.entries(acc).forEach(([key,a])=>{
    let unitTotal=0;
    Object.entries(a.units).forEach(([code,n])=>{ unitTotal += n*CLINICAL_RATE_TABLE[code]; });
    const monthlyTotal = unitTotal + (a.cpstMinutes/60)*CLINICAL_CPST_RATE;
    const monthlyGoal = clinicalTargetForName(a.name);
    const dischargeGoal = Math.round(CLINICAL_DISCHARGE_WEEKLY_GOAL*WEEKS_PER_MONTH);
    const outreachGoal = Math.round(CLINICAL_OUTREACH_WEEKLY_GOAL*WEEKS_PER_MONTH);
    const paceStatus = monthlyGoal!=null ? Math.round(monthlyGoal*(dayOfMonth/daysInMonth)*100)/100 : null;
    matched.push({
      name:a.name, key,
      monthlyTotal: Math.round(monthlyTotal*100)/100,
      monthlyGoal,
      progressPct: monthlyGoal ? Math.round((monthlyTotal/monthlyGoal)*1000)/10 : null,
      paceStatus,
      dischargeTotal:a.discharge, dischargeGoal, dischargePct: Math.round((a.discharge/dischargeGoal)*1000)/10,
      outreachTotal:a.outreach, outreachGoal, outreachPct: Math.round((a.outreach/outreachGoal)*1000)/10,
      weeklyTotals:a.weekly.map(v=>Math.round(v*100)/100),
    });
  });
  return { matched, unmatched };
}

function catalogFreshness(entry, cadenceDays){
  if(!entry || !entry.uploaded_at) return {label:'Never uploaded', cls:'bad'};
  const days = Math.floor((Date.now() - new Date(entry.uploaded_at).getTime())/86400000);
  const when = days<=0 ? 'today' : `${days}d ago`;
  if(cadenceDays==null) return {label:`Last: ${when}`, cls:'neutral'};
  if(days <= cadenceDays) return {label:`Fresh · ${when}`, cls:'good'};
  if(days <= cadenceDays*1.5) return {label:`Due · ${when}`, cls:'warn'};
  return {label:`Overdue · ${when}`, cls:'bad'};
}

function mCard(mgr,sel,cfn){
  const info=MGR[mgr];
  const act=S.staff.filter(s=>s.status==='Active'&&s.mgr===mgr);
  const dm=pdResolved();
  const hc=act.reduce((a,s)=>{const h=gH(s,dm[s.id],S.tgt);a[h]=(a[h]||0)+1;return a;},{});
  const hrs=act.reduce((a,s)=>a+(dm[s.id]?.hours||0),0);
  const cas=act.reduce((a,s)=>a+(dm[s.id]?.caseload||0),0);
  const oT=S.tasks.filter(t=>t.assignedTo===mgr&&t.status!=='Completed').length;
  const uR=S.renewals.filter(r=>r.manager===mgr&&r.status!=='Completed'&&Math.ceil((new Date(r.dueDate)-new Date())/86400000)<=30).length;
  const bg=sel?info.c:'#fff',cl=sel?'#fff':'#2C3B7E',sc=sel?'rgba(255,255,255,0.15)':'#F8FAFC';
  const lc=sel?'rgba(255,255,255,0.55)':'#9CA3AF',vc=sel?'#fff':info.c;
  const fn=cfn||`H.nav('manager','${mgr}')`;
  const hbars=['good','warning','critical','none'].map(h=>hc[h]>0?`<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${sel?'rgba(255,255,255,0.2)':'#fff'};color:${sel?'#fff':'#374151'};border:1px solid #e6dfd2">${{good:'🟢',warning:'🟡',critical:'🔴',none:'⚪'}[h]}${hc[h]}</span>`:'').join('');
  const alrt=(oT>0||uR>0)?`<div style="display:flex;gap:4px;margin-top:4px">${oT>0?`<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${sel?'rgba(255,255,255,0.15)':'#FEF3C7'};color:${sel?'#fff':'#92400E'};font-weight:700">📋${oT}</span>`:''}${uR>0?`<span style="font-size:9px;padding:1px 5px;border-radius:3px;background:${sel?'rgba(255,255,255,0.15)':'#FEE2E2'};color:${sel?'#fff':'#991B1B'};font-weight:700">🔔${uR}</span>`:''}</div>`:'';
  return`<div onclick="${fn}" style="background:${bg};border-radius:3px;padding:11px 12px;cursor:pointer;border:1px solid ${sel?info.c:'#e6dfd2'};box-shadow:${sel?`0 4px 14px ${info.c}40`:'0 1px 3px rgba(0,0,0,0.04)'};transition:all 0.15s;min-width:0;overflow:hidden">
    <div style="font-weight:600;font-size:13px;color:${cl};margin-bottom:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${info.full}</div>
    <div style="font-size:10px;color:${lc};margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${info.prog}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:4px;margin-bottom:7px;min-width:0">
      ${[['Staff',act.length],['Hours',hrs>0?Math.round(hrs):'—'],['Cases',cas>0?cas:'—']].map(([l,v])=>`<div style="text-align:center;background:${sc};border-radius:2px;padding:4px 2px;min-width:0;overflow:hidden"><div style="font-family:'Fraunces',serif;font-size:15px;font-weight:400;letter-spacing:-0.02em;color:${vc};line-height:1.1">${v}</div><div style="font-size:8.5px;color:${lc};text-transform:uppercase;letter-spacing:0.04em">${l}</div></div>`).join('')}
    </div>
    <div style="display:flex;gap:3px;flex-wrap:wrap">${hbars}</div>${alrt}
  </div>`;
}

// NEW (9/10): "Alicia/Ashley Allen won't go away after I deactivated them" turned out to be the
// same root cause already seen with Tey Miller showing under both Youngstown and Dayton — a
// second roster row for the same person (usually added by a different manager, or a re-add after
// a name-spelling mismatch) that never got deactivated when the other copy was. tgS()/delS() only
// ever act on the one row they're pointed at, so a duplicate is otherwise invisible until someone
// notices the person "still showing." This groups the full roster (every status, every manager) by
// normalized full name and surfaces any name with 2+ rows, so a duplicate gets caught and resolved
// (Deactivate the stale row, then Delete it once Inactive) instead of rediscovered by chance later.
function dupStaffGroups(){
  const byName={};
  S.staff.forEach(s=>{
    const key=`${(s.fn||'').trim()} ${(s.ln||'').trim()}`.trim().toLowerCase();
    if(!key)return;
    (byName[key]=byName[key]||[]).push(s);
  });
  return Object.values(byName).filter(g=>g.length>1).sort((a,b)=>a[0].fn.localeCompare(b[0].fn));
}
